<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Connect Elgin - Admin Seguro</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f172a;color:#e2e8f0;overscroll-behavior:none}
#loginScreen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px at 20% 10%, #6366f122, transparent),radial-gradient(600px at 80% 90%, #06b6d422, transparent),#0f172a}
.card{width:100%;max-width:440px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:28px;box-shadow:0 20px 60px #0005}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo .dot{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;font-weight:800;color:white}
.tabs{display:flex;background:#0f172a;border-radius:10px;padding:4px;margin-bottom:18px}
.tab{flex:1;padding:10px;border-radius:8px;text-align:center;cursor:pointer;color:#94a3b8;font-weight:600}
.tab.active{background:#334155;color:white}
label{font-size:13px;color:#94a3b8;margin:12px 0 6px;display:block}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;outline:none;font-size:16px}
input:focus{border-color:#6366f1}
.btn{width:100%;padding:13px;border-radius:10px;border:none;background:#6366f1;color:white;font-weight:700;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.6}
.colors{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.color{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color.sel{border-color:white;box-shadow:0 0 0 2px #6366f1}
.err{background:#7f1d1d33;border:1px solid #7f1d1d;color:#fecaca;padding:10px;border-radius:10px;font-size:13px;margin-top:12px;display:none}
.ok{color:#22c55e;font-size:12px;margin-top:10px}
#chatScreen{display:none;height:100vh;height:100dvh;flex-direction:row;overflow:hidden}
.side{width:320px;background:#111827;border-right:1px solid #1f2937;display:flex;flex-direction:column;transition:transform .3s ease;z-index:20}
.main{flex:1;display:flex;flex-direction:column;background:#f8fafc;min-width:0}
#msgInput{background:#ffffff !important;color:#111827 !important;-webkit-text-fill-color:#111827 !important;caret-color:#111827 !important;font-size:16px}
#msgInput::placeholder{color:#9ca3af !important}
.msg-wrap{position:relative; display:flex; gap:10px; margin-bottom:18px}
.msg-wrap:hover .msg-actions{opacity:1}
.msg-actions{opacity:0; transition:.2s; display:flex; gap:6px; margin-left:8px}
.del-btn{background:#fee2e2;border:1px solid #fecaca;color:#dc2626;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px}
.badge{background:#ef4444;color:white;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.badge-channel{background:#6366f1}
.badge-dm{background:#ef4444}
.read-status{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:4px}
.read-sent{color:#94a3b8}
.read-delivered{color:#64748b}
.read-seen{color:#22c55e;font-weight:600}
.read-seen-blue{color:#0ea5e9;font-weight:700}
.mobile-header{display:none}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:15}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid #111827;position:absolute;bottom:-2px;right:-2px}
.status-online{background:#22c55e;box-shadow:0 0 0 2px #22c55e44}
.status-offline{background:#4b5563}
@media(max-width:768px){
  .side{position:fixed;inset:0 35% 0 0;transform:translateX(-100%);}
  .side.open{transform:translateX(0);}
  .overlay.show{display:block}
  .mobile-header{display:flex}
}
</style>
</head>
<body>
<div id="loginScreen">
<div class="card">
<div class="logo"><div class="dot">C</div><div><b>Connect Elgin</b><div style="font-size:12px;color:#94a3b8">PC e Celular - Admin seguro</div></div></div>
<div class="tabs"><div id="tabLogin" class="tab active" onclick="switchTab('login')">Entrar</div><div id="tabReg" class="tab" onclick="switchTab('reg')">Criar conta</div></div>
<div id="formLogin">
<label>Email</label><input id="l_email" placeholder="seu@elgin.com.br" type="email" autocomplete="email">
<label>Senha</label><input id="l_senha" placeholder="Sua senha" type="password" autocomplete="current-password">
<div id="l_err" class="err"></div>
<button id="btnLogin" class="btn" onclick="doLogin()">Entrar</button>
</div>
<div id="formReg" style="display:none">
<label>Nome completo</label><input id="r_nome" placeholder="Ex: João Silva">
<label>Cargo</label><input id="r_cargo" placeholder="Ex: Marketing" value="Colaborador">
<label>Email</label><input id="r_email" placeholder="seu@elgin.com.br" type="email">
<label>Senha (min 6)</label><input id="r_senha" type="password" placeholder="Crie uma senha">
<label>Confirmar senha</label><input id="r_senha2" type="password" placeholder="Repita a senha">
<label>Cor do avatar</label><div class="colors" id="colorPick"></div>
<div id="r_err" class="err"></div>
<button id="btnReg" class="btn" onclick="doRegister()">Criar conta e entrar</button>
</div>
<div id="status" class="ok">Carregando...</div>
</div>
</div>

<div id="overlay" class="overlay" onclick="closeSidebar()"></div>
<div id="chatScreen">
<div class="side" id="sidebar">
<div style="padding:18px;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center"><b style="color:white">Connect</b><div style="display:flex;gap:6px"><button id="adminBtn" onclick="openAdminPanel()" style="display:none;background:#7c3aed;color:white;border:none;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px">👑 Admin</button><button onclick="doLogout()" style="background:#1f2937;color:#94a3b8;border:none;padding:6px 10px;border-radius:8px;cursor:pointer">Sair</button></div></div>
<div style="padding:12px"><div style="font-size:11px;color:#6b7280;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><span>CANAIS</span><button onclick="openCreateChannelModal()" style="width:22px;height:22px;border-radius:6px;border:1px solid #2a3441;background:#1f2937;color:#9ca3af;cursor:pointer;font-weight:700">+</button></div><div id="chanList"></div></div>
<div style="padding:12px;flex:1;overflow:auto">
<div style="font-size:11px;color:#6b7280;letter-spacing:1px;margin-bottom:8px">MENSAGENS DIRETAS</div>
<div id="dmList"></div>
</div>
<div style="padding:12px;border-top:1px solid #1f2937;display:flex;gap:10px;align-items:center">
<div id="myAvatar" style="width:36px;height:36px;border-radius:50%;background:#6366f1;display:grid;place-items:center;font-weight:700;color:white">U</div>
<div style="flex:1;min-width:0"><div id="myName" style="font-size:13px;font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">...</div><div id="myEmail" style="font-size:11px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">...</div></div>
</div>
</div>
<div class="main">
<div class="mobile-header" style="padding:12px;background:#111827;color:white;align-items:center;gap:12px;border-bottom:1px solid #1f2937"><button onclick="openSidebar()" style="background:#1f2937;border:none;color:white;padding:8px 10px;border-radius:8px">☰</button><b id="mobTitle"># geral</b></div>
<div style="padding:16px 18px;background:white;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center"><div><div id="currentChanLabel" style="font-weight:700;color:#111827"># geral</div><div id="currentChanDesc" style="font-size:12px;color:#6b7280">Canal geral da empresa</div></div><div id="typingIndicator" style="font-size:12px;color:#6366f1"></div></div>
<div id="messages" style="flex:1;overflow:auto;padding:18px;background:#f8fafc"></div>
<div style="padding:12px;background:white;border-top:1px solid #e5e7eb;display:flex;gap:10px"><input id="msgInput" placeholder="Escreva uma mensagem..." onkeydown="if(event.key==='Enter') sendMessage()" style="flex:1;padding:12px 14px;border-radius:10px;border:1px solid #e5e7eb;outline:none"><button onclick="sendMessage()" style="padding:12px 18px;border-radius:10px;border:none;background:#111827;color:white;font-weight:700;cursor:pointer">Enviar</button></div>
</div>
</div>

<!-- Admin Panel -->
<div id="adminPanel" style="display:none;position:fixed;inset:0;z-index:50;background:#0f172a;overflow:auto;padding:20px">
<div style="max-width:900px;margin:0 auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h2 style="color:white">👑 Painel Admin - Seguro</h2><button onclick="closeAdminPanel()" style="background:#1f2937;color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer">Fechar</button></div>
<div style="display:flex;gap:8px;margin-bottom:16px">
<button id="adminTabUsers" onclick="switchAdminTab('users')" style="padding:8px 12px;border-radius:8px;border:1px solid #6366f1;background:#6366f122;color:white;cursor:pointer">Usuários (<span id="adminUserCount">0</span>)</button>
<button id="adminTabChannels" onclick="switchAdminTab('channels')" style="padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer">Canais</button>
<button id="adminTabMessages" onclick="switchAdminTab('messages')" style="padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer">Ações</button>
</div>
<div id="adminTabContent"></div>
</div>
</div>

<!-- Modals -->
<div id="editUserModal" style="display:none;position:fixed;inset:0;background:#0008;z-index:60;align-items:center;justify-content:center;padding:20px">
<div style="background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px;width:100%;max-width:400px">
<h3 style="color:white;margin-bottom:12px">Editar usuário</h3>
<input type="hidden" id="editUserId">
<label>Nome</label><input id="editUserNome">
<label>Cargo</label><input id="editUserCargo">
<label>Email</label><input id="editUserEmail" disabled>
<label>Cor</label><input id="editUserColor" type="color">
<label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" id="editUserIsAdmin"> <span style="color:#a78bfa">É Admin?</span></label>
<div id="editUserErr" class="err"></div>
<div style="display:flex;gap:10px;margin-top:14px"><button onclick="saveEditUser()" style="flex:1;padding:10px;border-radius:8px;border:none;background:#6366f1;color:white;font-weight:700;cursor:pointer">Salvar</button><button onclick="closeEditUser()" style="flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer">Cancelar</button></div>
</div>
</div>

<script>
// ================= CONFIG =================
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_DOMINIO.firebaseapp.com",
  databaseURL: "https://SEU_PROJETO.firebaseio.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "xxx",
  appId: "xxx"
};

// LISTA MESTRA - só esses e-mails ganham isAdmin=true no primeiro cadastro
const ADMIN_EMAILS = [
  'admin@elgin.com.br',
  'ti@elgin.com.br'
].map(e=>e.toLowerCase());

let currentUser=null;
let allChannelsCache={};
let currentChannel={id:'geral', label:'geral'};
let allUsersCache={};

const COLORS = ['#6366f1','#06b6d4','#22c55e','#f59e0b','#ef4444','#a855f7','#ec4899'];

// ================ INIT =================
function initFirebase(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    document.getElementById('status').textContent='Pronto para entrar';
    setupColorPicker();
    firebase.auth().onAuthStateChanged(async user=>{
      if(user){
        const snap = await firebase.database().ref('users/'+user.uid).once('value');
        let dbUser = snap.val();
        if(!dbUser){
          // fallback se registrou sem gravar
          dbUser = { nome: user.displayName || 'Usuário', email: user.email, cargo:'Colaborador', avatarColor:COLORS[0], isAdmin: ADMIN_EMAILS.includes((user.email||'').toLowerCase()) };
          await firebase.database().ref('users/'+user.uid).set({...dbUser, online:true, lastSeen: firebase.database.ServerValue.TIMESTAMP});
        }
        // ATUALIZA isAdmin se estiver na lista mestra (garante privilégio)
        const shouldBeAdmin = ADMIN_EMAILS.includes((dbUser.email||user.email||'').toLowerCase());
        if(shouldBeAdmin && !dbUser.isAdmin){
          await firebase.database().ref('users/'+user.uid).update({isAdmin:true});
          dbUser.isAdmin = true;
        }
        currentUser = { id:user.uid, ...dbUser, email: dbUser.email || user.email };
        document.getElementById('myAvatar').textContent=(currentUser.nome||'U')[0].toUpperCase();
        document.getElementById('myAvatar').style.background=currentUser.avatarColor||'#6366f1';
        document.getElementById('myName').textContent=currentUser.nome;
        document.getElementById('myEmail').textContent=currentUser.email + (currentUser.isAdmin?' 👑':'');
        // SEGURANÇA: botão só se isAdmin do BANCO
        if(currentUser.isAdmin){
          document.getElementById('adminBtn').style.display='block';
        }
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('chatScreen').style.display='flex';
        await firebase.database().ref('users/'+user.uid).update({online:true, lastActive: firebase.database.ServerValue.TIMESTAMP});
        firebase.database().ref('users/'+user.uid).onDisconnect().update({online:false, lastSeen: firebase.database.ServerValue.TIMESTAMP, lastActive:0});
        loadChannels();
        loadUsers();
      } else {
        document.getElementById('loginScreen').style.display='flex';
        document.getElementById('chatScreen').style.display='none';
      }
    });
  }catch(e){
    document.getElementById('status').textContent='Erro config Firebase: '+e.message;
  }
}

function setupColorPicker(){
  const c=document.getElementById('colorPick'); c.innerHTML='';
  COLORS.forEach((col,i)=>{
    const d=document.createElement('div'); d.className='color'+(i===0?' sel':''); d.style.background=col;
    d.onclick=()=>{ document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); };
    c.appendChild(d);
  });
}
function getSelectedColor(){ const s=document.querySelector('.color.sel'); return s? s.style.background : COLORS[0]; }

function switchTab(t){
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabReg').classList.toggle('active', t==='reg');
  document.getElementById('formLogin').style.display = t==='login' ? 'block':'none';
  document.getElementById('formReg').style.display = t==='reg' ? 'block':'none';
}

// ================ AUTH =================
async function doLogin(){
  const email=document.getElementById('l_email').value.trim().toLowerCase();
  const senha=document.getElementById('l_senha').value;
  const err=document.getElementById('l_err');
  if(!email||!senha){ err.textContent='Preencha email e senha'; err.style.display='block'; return; }
  try{ await firebase.auth().signInWithEmailAndPassword(email,senha); }catch(e){ err.textContent=e.message; err.style.display='block'; }
}
async function doRegister(){
  const nome=document.getElementById('r_nome').value.trim();
  const cargo=document.getElementById('r_cargo').value.trim()||'Colaborador';
  const email=document.getElementById('r_email').value.trim().toLowerCase();
  const s1=document.getElementById('r_senha').value;
  const s2=document.getElementById('r_senha2').value;
  const err=document.getElementById('r_err');
  if(nome.length<3){ err.textContent='Nome muito curto'; err.style.display='block'; return; }
  if(s1.length<6){ err.textContent='Senha min 6'; err.style.display='block'; return; }
  if(s1!==s2){ err.textContent='Senhas diferentes'; err.style.display='block'; return; }
  try{
    const cred=await firebase.auth().createUserWithEmailAndPassword(email,s1);
    const isAdmin = ADMIN_EMAILS.includes(email);
    const color=getSelectedColor();
    await firebase.database().ref('users/'+cred.user.uid).set({
      nome, cargo, email, avatarColor:color, isAdmin,
      online:true, lastSeen: firebase.database.ServerValue.TIMESTAMP, lastActive: Date.now()
    });
  }catch(e){ err.textContent=e.message; err.style.display='block'; }
}

// ================ CHAT CORE (simplificado mantendo seu original) =================
function loadChannels(){
  firebase.database().ref('channels').on('value', snap=>{
    const data=snap.val()||{ geral:{id:'geral', label:'geral'}};
    allChannelsCache=data;
    const list=document.getElementById('chanList'); list.innerHTML='';
    Object.values(data).forEach(ch=>{
      const div=document.createElement('div');
      div.style.cssText='padding:8px 10px;border-radius:8px;cursor:pointer;color:#94a3b8;display:flex;justify-content:space-between;align-items:center';
      if(currentChannel.id===ch.id) div.style.background='#1f2937', div.style.color='white';
      div.innerHTML=`<span># ${ch.label}</span>`;
      div.onclick=()=>selectChannel(ch.id, ch.label, 'channel');
      list.appendChild(div);
    });
    if(!allChannelsCache[currentChannel.id]) selectChannel('geral','geral','channel');
    else loadMessages();
  });
}
function selectChannel(id,label,type){
  currentChannel={id,label,type};
  document.getElementById('currentChanLabel').textContent='# '+label;
  document.getElementById('mobTitle').textContent='# '+label;
  loadMessages();
  closeSidebar();
}
function loadMessages(){
  const ref = firebase.database().ref('channels/'+currentChannel.id+'/messages').limitToLast(100);
  ref.on('value', snap=>{
    const msgs=snap.val()||{};
    const cont=document.getElementById('messages'); cont.innerHTML='';
    Object.entries(msgs).sort((a,b)=>a[1].timestamp-b[1].timestamp).forEach(([mid,m])=>{
      const isMe = m.uid===currentUser.id;
      const canDelete = isMe || currentUser.isAdmin;
      const user = allUsersCache[m.uid] || {nome:'...', avatarColor:'#6366f1'};
      const div=document.createElement('div'); div.className='msg-wrap';
      div.innerHTML=`<div style="width:36px;height:36px;border-radius:50%;background:${user.avatarColor||'#6366f1'};display:grid;place-items:center;color:white;font-weight:700;flex-shrink:0">${(user.nome||'U')[0]}</div><div><div style="font-weight:600;color:#111827;font-size:13px">${user.nome||m.nome||'Usuário'} <span style="font-weight:400;color:#6b7280;font-size:11px">${new Date(m.timestamp).toLocaleTimeString()}</span></div><div style="background:white;border:1px solid #e5e7eb;padding:8px 12px;border-radius:10px;margin-top:4px;color:#111827;font-size:14px">${m.text}</div></div><div class="msg-actions">${canDelete?`<button class="del-btn" onclick="deleteMsg('${mid}')">Apagar</button>`:''}</div>`;
      cont.appendChild(div);
    });
    cont.scrollTop=cont.scrollHeight;
  });
}
function sendMessage(){
  const inp=document.getElementById('msgInput'); const text=inp.value.trim(); if(!text) return;
  firebase.database().ref('channels/'+currentChannel.id+'/messages').push({text, uid:currentUser.id, nome:currentUser.nome, timestamp: firebase.database.ServerValue.TIMESTAMP});
  inp.value='';
}
function deleteMsg(mid){
  if(!confirm('Apagar mensagem?')) return;
  firebase.database().ref('channels/'+currentChannel.id+'/messages/'+mid).remove();
}
function loadUsers(){
  firebase.database().ref('users').on('value', snap=>{
    allUsersCache=snap.val()||{};
    window.allUsers=Object.entries(allUsersCache).map(([id,v])=>({id,...v}));
    const dmList=document.getElementById('dmList'); dmList.innerHTML='';
    Object.values(allUsersCache).forEach(u=>{
      if(!u || u.id===currentUser.id || !u.nome) return;
      // pega id real
    });
    // rebuild para DMs
    Object.entries(allUsersCache).forEach(([uid,u])=>{
      if(uid===currentUser.id) return;
      const div=document.createElement('div');
      div.style.cssText='padding:8px 10px;border-radius:8px;cursor:pointer;color:#94a3b8;display:flex;gap:8px;align-items:center';
      div.innerHTML=`<div style="position:relative"><div style="width:28px;height:28px;border-radius:50%;background:${u.avatarColor||'#6366f1'};display:grid;place-items:center;color:white;font-weight:700;font-size:12px">${(u.nome||'U')[0]}</div><div class="status-dot ${u.online?'status-online':'status-offline'}"></div></div><div style="font-size:13px">${u.nome}</div>`;
      dmList.appendChild(div);
    });
  });
}

// ================ ADMIN SEGURO =================
function isCurrentUserAdmin(){
  return currentUser && currentUser.isAdmin === true;
}
function openAdminPanel(){
  if(!isCurrentUserAdmin()){
    alert('Acesso negado: apenas admins');
    return;
  }
  document.getElementById('adminPanel').style.display='block';
  switchAdminTab('users');
}
function closeAdminPanel(){ document.getElementById('adminPanel').style.display='none'; }

function switchAdminTab(tab){
 document.getElementById('adminTabUsers').style.borderColor=tab==='users'?'#6366f1':'#334155';
 document.getElementById('adminTabUsers').style.background=tab==='users'?'#6366f122':'#0f172a';
 document.getElementById('adminTabChannels').style.background=tab==='channels'?'#6366f122':'#0f172a';
 document.getElementById('adminTabChannels').style.borderColor=tab==='channels'?'#6366f1':'#334155';
 document.getElementById('adminTabMessages').style.background=tab==='messages'?'#6366f122':'#0f172a';
 document.getElementById('adminTabMessages').style.borderColor=tab==='messages'?'#6366f1':'#334155';
 if(tab==='users') renderAdminUsers();
 if(tab==='channels') renderAdminChannels();
 if(tab==='messages') renderAdminMessages();
}
function renderAdminUsers(){
 const cont=document.getElementById('adminTabContent');
 const list=Object.entries(allUsersCache).map(([id,v])=>({id,...v}));
 document.getElementById('adminUserCount').textContent=list.length;
 cont.innerHTML=`<div style="margin-bottom:12px;font-size:13px;color:#94a3b8">Regra segura ativa: só quem tem isAdmin=true no banco tem poder total</div>`;
 list.sort((a,b)=> (a.email||'').localeCompare(b.email||'')).forEach(u=>{
   const isSelf = u.id===currentUser.id;
   const online = u.online;
   const div=document.createElement('div');
   div.style.cssText='display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #334155;border-radius:10px;margin-bottom:8px;background:#0f172a';
   div.innerHTML=`<div style="width:40px;height:40px;border-radius:50%;background:${u.avatarColor||'#6366f1'};display:grid;place-items:center;color:white;font-weight:700">${(u.nome||'U')[0].toUpperCase()}</div><div style="flex:1"><div style="font-weight:600;color:white">${u.nome||'Sem nome'} ${u.isAdmin?'<span style="background:#7c3aed;color:white;font-size:10px;padding:2px 6px;border-radius:4px">ADMIN</span>':''}</div><div style="font-size:12px;color:#94a3b8">${u.email||''}</div><div style="font-size:11px;color:${online?'#22c55e':'#6b7280'}">${online?'🟢 online':'⚫ offline'}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button onclick="openEditUser('${u.id}')" style="padding:6px 12px;border-radius:6px;border:1px solid #334155;background:#1f2937;color:#94a3b8;cursor:pointer;font-size:12px">✏️</button><button onclick="adminDeleteUser('${u.id}','${(u.nome||'').replace(/'/g,"")}')" style="padding:6px 12px;border-radius:6px;border:1px solid #7f1d1d;background:#7f1d1d22;color:#f87171;cursor:pointer;font-size:12px" ${isSelf?'disabled':''}>🗑️</button></div>`;
   cont.appendChild(div);
 });
}
function openEditUser(userId){
 const u = allUsersCache[userId]; if(!u){ alert('Não encontrado'); return; }
 document.getElementById('editUserId').value=userId;
 document.getElementById('editUserNome').value=u.nome||'';
 document.getElementById('editUserCargo').value=u.cargo||'';
 document.getElementById('editUserEmail').value=u.email||'';
 document.getElementById('editUserColor').value=u.avatarColor||'#6366f1';
 document.getElementById('editUserIsAdmin').checked = !!u.isAdmin;
 document.getElementById('editUserErr').style.display='none';
 document.getElementById('editUserModal').style.display='flex';
}
function closeEditUser(){ document.getElementById('editUserModal').style.display='none'; }
function saveEditUser(){
 const id=document.getElementById('editUserId').value;
 const nome=document.getElementById('editUserNome').value.trim();
 const cargo=document.getElementById('editUserCargo').value.trim();
 const color=document.getElementById('editUserColor').value;
 const isAdmin=document.getElementById('editUserIsAdmin').checked;
 if(nome.length<2){ document.getElementById('editUserErr').textContent='Nome muito curto'; document.getElementById('editUserErr').style.display='block'; return; }
 firebase.database().ref('users/'+id).update({nome, cargo, avatarColor:color, isAdmin}).then(()=>{ closeEditUser(); });
}
function adminDeleteUser(userId, nome){
 if(!isCurrentUserAdmin()) return alert('Sem permissão');
 if(userId===currentUser.id){ alert('Não pode excluir a si mesmo'); return; }
 if(!confirm('Excluir usuário '+nome+'? Isso apaga do banco. O Auth precisa ser excluído manualmente no Firebase Console > Authentication')) return;
 firebase.database().ref('users/'+userId).remove().then(()=>{ alert('Excluído do database! Lembre de excluir também em Authentication'); renderAdminUsers(); });
}
function renderAdminChannels(){
 const cont=document.getElementById('adminTabContent');
 const list=Object.values(allChannelsCache);
 cont.innerHTML=`<div style="margin-bottom:12px;font-size:13px;color:#94a3b8">Total: ${list.length} canais</div>`;
 list.forEach(ch=>{
   const div=document.createElement('div');
   div.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #334155;border-radius:10px;margin-bottom:8px;background:#0f172a';
   div.innerHTML=`<div><div style="font-weight:600;color:white">${ch.label}</div><div style="font-size:11px;color:#6b7280">ID: ${ch.id}</div></div><div style="display:flex;gap:6px"><button onclick="selectChannel('${ch.id}','${ch.label}','channel'); closeAdminPanel();" style="padding:6px 12px;border-radius:6px;border:1px solid #334155;background:#1f2937;color:#94a3b8;cursor:pointer;font-size:12px">Abrir</button><button onclick="if(confirm('Excluir canal ${ch.label}?')) firebase.database().ref('channels/${ch.id}').remove()" style="padding:6px 12px;border-radius:6px;border:1px solid #7f1d1d;background:#7f1d1d22;color:#f87171;cursor:pointer;font-size:12px" ${ch.id==='geral'?'disabled':''}>🗑️</button></div>`;
   cont.appendChild(div);
 });
}
function renderAdminMessages(){
 const cont=document.getElementById('adminTabContent');
 cont.innerHTML=`<div style="padding:12px;background:#7c3aed22;border:1px solid #7c3aed44;border-radius:10px;margin-bottom:12px"><div style="font-weight:600;color:white;margin-bottom:6px">👑 Admin Seguro</div><ul style="font-size:13px;color:#d1d5db;margin-left:16px"><li>isAdmin verificado no banco (não no front)</li><li>Regras do Realtime Database bloqueiam não-admin</li><li>Excluir qualquer mensagem</li><li>Gerenciar canais e usuários</li></ul></div><button onclick="if(confirm('Limpar TODAS as mensagens de TODOS os canais?')){ firebase.database().ref('channels').once('value', s=>{ s.forEach(c=>{ firebase.database().ref('channels/'+c.key+'/messages').remove(); }); alert('Mensagens apagadas, canais mantidos'); })}" style="width:100%;padding:12px;border-radius:10px;border:1px solid #7f1d1d;background:#7f1d1d22;color:#f87171;cursor:pointer;font-weight:600">⚠️ Limpar todas as mensagens</button>`;
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
function openCreateChannelModal(){ const n=prompt('Nome do novo canal:'); if(n){ const id=n.toLowerCase().replace(/\s+/g,'-'); firebase.database().ref('channels/'+id).set({id,label:n}); } }
async function doLogout(){
 try{ if(currentUser){ await firebase.database().ref('users/'+currentUser.id).update({online:false, lastSeen: firebase.database.ServerValue.TIMESTAMP, lastActive:0}); await firebase.database().ref('users/'+currentUser.id).onDisconnect().cancel(); } }catch(e){}
 await firebase.auth().signOut(); location.reload();
}
function isUserOnline(u){ return u && u.online; }
setTimeout(initFirebase,400);
</script>
</body>
</html>
