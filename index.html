function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
function showErr(id,msg){const el=document.getElementById(id);el.style.display='block';el.textContent=msg}
function hideErr(id){document.getElementById(id).style.display='none'}
function formatLastSeen(ts){ if(!ts) return 'offline'; const diff=Date.now()-ts; const m=Math.floor(diff/60000); if(m<1) return 'agora'; if(m<60) return `há ${m} min`; const h=Math.floor(m/60); if(h<24) return `há ${h}h`; const d=Math.floor(h/24); return `há ${d}d`; }
function isUserOnline(u){ if(!u) return false; const now=Date.now(); const last = u.lastActive || u.lastSeen || 0; if(!last && u.online){ if(u.createdAt && (now - u.createdAt) > 5*60*1000) return false; return false; } return (now - last) < 90*1000; }
function setupPresence(uid){
  const userRef = firebase.database().ref('users/'+uid);
  const connectedRef = firebase.database().ref('.info/connected');
  connectedRef.on('value', (snap) => {
    if(snap.val()===true){
      userRef.onDisconnect().update({online:false,lastSeen: firebase.database.ServerValue.TIMESTAMP,lastActive:0}).then(()=>{
        userRef.update({online:true,lastSeen: firebase.database.ServerValue.TIMESTAMP,lastActive: firebase.database.ServerValue.TIMESTAMP});
      });
    }
  });
  setInterval(()=>{ if(currentUser && firebase.auth().currentUser){ userRef.update({lastActive: firebase.database.ServerValue.TIMESTAMP, lastSeen: firebase.database.ServerValue.TIMESTAMP, online:true}); } }, 20000);
  window.addEventListener('beforeunload', ()=>{ userRef.update({online:false, lastSeen: firebase.database.ServerValue.TIMESTAMP, lastActive:0}); });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ userRef.update({online:true, lastActive: firebase.database.ServerValue.TIMESTAMP, lastSeen: firebase.database.ServerValue.TIMESTAMP}); } });
}
function fixPresence(){
  if(!isAdmin()){ alert('Só admin'); return; }
  if(!confirm('Marcar todos offline exceto você?')) return;
  firebase.database().ref('users').once('value').then(snap=>{
    const val=snap.val()||{};
    Object.keys(val).forEach(uid=>{ if(uid!==currentUser.id){ firebase.database().ref('users/'+uid).update({online:false, lastActive:0, lastSeen: Date.now() - 10*60*1000}); } });
    alert('Corrigido!');
  });
}
function setupAuth(){
 firebase.auth().onAuthStateChanged(async (user)=>{
  if(user){
   const uid=user.uid;
   const snap=await firebase.database().ref('users/'+uid).once('value');
   let data=snap.val();
   if(!data){
     const pendingNome=localStorage.getItem('pendingNome')||user.email.split('@')[0];
     const pendingCargo=localStorage.getItem('pendingCargo')||'Colaborador';
     const pendingColor=localStorage.getItem('pendingColor')||selColor;
     data={id:uid,nome:pendingNome,cargo:pendingCargo,email:user.email,avatarColor:pendingColor,online:true,createdAt:Date.now(),lastSeen:Date.now(),lastActive:Date.now()};
     try{ await firebase.database().ref('users/'+uid).set(data); }catch(e){ console.error('Permissão negada ao criar usuário - verifique regras', e); }
   }
   currentUser={id:uid,...data,nome:data.nome||data.email.split('@')[0]};
   document.getElementById('loginScreen').style.display='none';
   document.getElementById('chatScreen').style.display='flex';
   setupPresence(uid);
   initChat();
  }else{
   document.getElementById('loginScreen').style.display='flex';
   document.getElementById('chatScreen').style.display='none';
  }
 });
 document.getElementById('btnReg').onclick=async()=>{
  hideErr('r_err');
  const nome=document.getElementById('r_nome').value.trim();
  const cargo=document.getElementById('r_cargo').value.trim()||'Colaborador';
  const email=document.getElementById('r_email').value.trim();
  const s=document.getElementById('r_senha').value;
  const s2=document.getElementById('r_senha2').value;
  if(nome.length<3) return showErr('r_err','Nome minimo 3 letras');
  if(!email.includes('@')) return showErr('r_err','Email invalido');
  if(s.length<6) return showErr('r_err','Senha minima 6');
  if(s!==s2) return showErr('r_err','Senhas nao conferem');
  if(!firebaseLoaded) return showErr('r_err','Firebase carregando...');
  localStorage.setItem('pendingNome',nome);localStorage.setItem('pendingCargo',cargo);localStorage.setItem('pendingColor',selColor);
  document.getElementById('btnReg').textContent='Criando...';document.getElementById('btnReg').disabled=true;
  try{ await firebase.auth().createUserWithEmailAndPassword(email,s); }catch(e){ let msg=e.message; if(e.code==='auth/email-already-in-use') msg='Email ja cadastrado'; showErr('r_err',msg); }
  document.getElementById('btnReg').textContent='Criar conta e entrar';document.getElementById('btnReg').disabled=false;
 };
 document.getElementById('btnLogin').onclick=async()=>{
  hideErr('l_err');
  const email=document.getElementById('l_email').value.trim();
  const s=document.getElementById('l_senha').value;
  if(!email||!s) return showErr('l_err','Preencha email e senha');
  if(!firebaseLoaded) return showErr('l_err','Firebase carregando...');
  document.getElementById('btnLogin').textContent='Entrando...';document.getElementById('btnLogin').disabled=true;
  try{ await firebase.auth().signInWithEmailAndPassword(email,s); }catch(e){ showErr('l_err','Senha incorreta'); }
  document.getElementById('btnLogin').textContent='Entrar no Connect';document.getElementById('btnLogin').disabled=false;
 };
}
function initChat(){
 const defaultChans = {geral:{id:'geral',label:'# geral',protected:true, isPublic:true}};
 firebase.database().ref('channel_list').once('value').then(snap=>{ if(!snap.exists()){ firebase.database().ref('channel_list').set(defaultChans).catch(()=>{}); } });
 firebase.database().ref('channel_list').on('value', snap=>{
   const val = snap.val() || defaultChans;
   allChannelsCache = val;
   renderChannelList(val);
 });
 firebase.database().ref('users').on('value',snap=>{
  const val=snap.val()||{}; const list=Object.values(val).filter(u=>u && u.id);
  window.allUsers=list;
  renderUsers();
  const onlineCount=list.filter(u=>isUserOnline(u)).length;
  document.getElementById('conn').textContent=list.length+' usuarios - '+onlineCount+' online agora';
 });
 firebase.database().ref('.info/connected').on('value',s=>{ const sub=document.getElementById('chatSub'); if(!s.val()){ sub.textContent='🔴 Desconectado'; sub.style.color='#ef4444'; return; } sub.textContent='● Seguro'; });
 selectChannel('geral','# geral','channel');
 setupGlobalNotifications();
 if(isAdmin()){
   document.getElementById('adminBtn').style.display='inline-block';
   document.getElementById('fixBtn').style.display='inline-block';
   document.getElementById('adminOnlyNote').style.display='block';
 }
 document.getElementById('search').oninput=(e)=>renderUsers(e.target.value);
 document.getElementById('msgForm').onsubmit=(e)=>{e.preventDefault();sendMsg()};
 document.getElementById('attachBtn').onclick=()=>document.getElementById('fileInput').click();
 document.getElementById('fileInput').onchange=(e)=>{const f=e.target.files[0]; if(f) showFilePreview(f); e.target.value='';};
 window.addEventListener('focus', ()=>{ document.title=originalTitle; if(currentChannel){ clearUnread(currentChannel); markAsRead(); } });
 setInterval(()=>{ if(window.allUsers) renderUsers(document.getElementById('search').value); }, 30000);
}
function renderChannelList(channelsObj){
 const cl=document.getElementById('chanList'); cl.innerHTML='';
 let list = Object.values(channelsObj);
 list = list.filter(ch=>{ if(isAdmin()) return true; if(ch.id==='geral') return true; if(!ch.members) return true; return ch.members[currentUser.id] || ch.createdBy===currentUser.id; });
 list = list.sort((a,b)=> (a.id==='geral'?-1:b.id==='geral'?1: a.label.localeCompare(b.label)));
 list.forEach(ch=>{
  const isActive = ch.id===currentChannel && currentChannelType==='channel';
  const unread = unreadCounts[ch.id]||0;
  const d=document.createElement('div');
  d.style.cssText='padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;';
  d.style.background=isActive?'#1f2937':''; d.style.color=isActive?'white':'#9ca3af';
  if(unread>0 && !isActive){ d.style.background='#1f2937'; d.style.border='1px solid #6366f133'; }
  const canDelete = ch.id!=='geral';
  const isPrivate = ch.members ? '🔒 ' : '';
  const badge = unread>0 ? `<span class="badge badge-channel">${unread>99?'99+':unread}</span>` : '';
  d.innerHTML=`<span style="flex:1;display:flex;align-items:center;gap:6px" onclick="selectChannel('${ch.id}','${ch.label}','channel'); closeSidebar();">${isPrivate}${ch.label} ${badge}</span><div style="display:flex;gap:4px"><button onclick="openManageMembers('${ch.id}')" style="width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:#6366f1;cursor:pointer;font-size:12px">👥</button>${canDelete?`<button onclick="deleteChannel('${ch.id}','${ch.label}')" style="width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:#ef4444;cursor:pointer;font-size:12px">🗑️</button>`:''}</div>`;
  cl.appendChild(d);
 });
 updateTotalUnread();
}
function renderUsers(filter=''){
 const cont=document.getElementById('userList'); if(!window.allUsers){cont.innerHTML='<div style=color:#6b7280>Carregando...</div>';return}
 let list=window.allUsers.filter(u=>u.id!==currentUser.id);
 if(filter){const f=filter.toLowerCase(); list=list.filter(u=> ((u.nome||'')+' '+(u.cargo||'')+' '+(u.email||'')).toLowerCase().includes(f))}
 if(list.length===0){cont.innerHTML='<div style=color:#6b7280;font-size:13px;padding:8px>Nenhum usuario.</div>';return}
 cont.innerHTML='';
 list.sort((a,b)=>{ const aOn=isUserOnline(a)?1:0; const bOn=isUserOnline(b)?1:0; return bOn-aOn; }).forEach(u=>{
  const nome=u.nome|| (u.email?u.email.split('@')[0]:'Usuario');
  const dmId = [currentUser.id, u.id].sort().join('_');
  const unread = unreadCounts[dmId]||0;
  const online = isUserOnline(u);
  const statusText = online ? 'online agora' : (u.lastSeen ? 'visto '+formatLastSeen(u.lastSeen) : 'offline');
  const statusClass = online ? 'status-online' : 'status-offline';
  const d=document.createElement('div');d.style.cssText='display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;color:#d1d5db;position:relative';
  if(unread>0){ d.style.background='#1f2937'; d.style.border='1px solid #ef444433'; }
  d.onmouseenter=()=>{ if(unread===0) d.style.background='#1f2937'; }; d.onmouseleave=()=>{ if(unread===0) d.style.background='transparent'; };
  d.innerHTML=`<div style="position:relative"><div style="width:32px;height:32px;border-radius:50%;background:${u.avatarColor||'#6366f1'};display:grid;place-items:center;color:white;font-weight:700;font-size:12px">${nome[0].toUpperCase()}</div><div class="status-dot ${statusClass}"></div></div><div style="flex:1"><div style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px">${nome} ${unread>0?`<span class="badge badge-dm">${unread>99?'99+':unread}</span>`:''}</div><div style="font-size:11px;color:${online?'#22c55e':'#6b7280'}">${u.cargo||u.email} • ${statusText}</div></div>`;
  d.onclick=()=>{ selectUser(u); closeSidebar(); };
  cont.appendChild(d);
 });
 updateTotalUnread();
}
function updateTotalUnread(){
 const total=Object.values(unreadCounts).reduce((a,b)=>a+b,0);
 const el=document.getElementById('totalUnread');
 if(total>0){ el.textContent=total>99?'99+':total; el.style.display='inline-flex'; document.title='('+total+') '+originalTitle; }
 else { el.style.display='none'; document.title=originalTitle; }
}
function setChannelType(t){
 channelType=t;
 document.getElementById('typePublic').style.borderColor=t==='public'?'#6366f1':'#334155';
 document.getElementById('typePublic').style.background=t==='public'?'#6366f122':'#0f172a';
 document.getElementById('typePrivate').style.borderColor=t==='private'?'#6366f1':'#334155';
 document.getElementById('typePrivate').style.background=t==='private'?'#6366f122':'#0f172a';
 document.getElementById('membersSection').style.display=t==='private'?'block':'none';
 if(t==='private') renderMembersChecklist();
}
function renderMembersChecklist(){
 const cont=document.getElementById('membersChecklist');
 if(!cont || !window.allUsers) return;
 cont.innerHTML='';
 window.allUsers.filter(u=>u.id!==currentUser.id).forEach(u=>{
  const nome=u.nome||u.email.split('@')[0];
  const div=document.createElement('div'); div.style.cssText='display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px';
  div.innerHTML=`<input type="checkbox" value="${u.id}" id="chk_${u.id}" style="width:auto"><label for="chk_${u.id}" style="margin:0;color:#d1d5db;flex:1">${nome} - ${u.cargo||u.email}</label>`;

 });

function openCreateChannelModal(){
 document.getElementById('newChannelName').value='';
 document.getElementById('createChanErr').style.display='none';
 channelType='public'; setChannelType('public');
 document.getElementById('createChannelModal').style.display='flex';
}
function closeCreateChannelModal(){ document.getElementById('createChannelModal').style.display='none'; }
function createChannel(){
 const raw=document.getElementById('newChannelName').value.trim().toLowerCase();
 const errEl=document.getElementById('createChanErr');
 errEl.style.display='none';
 if(!raw || raw.length<2){ errEl.textContent='Nome muito curto'; errEl.style.display='block'; return; }
 let id = raw.replace(/[^a-z0-9_-]/g, '-').replace(/-+/g,'-').replace(/^[-_]+|[-_]+$/g,'');
 if(!id || id==='geral'){ errEl.textContent='Nome reservado'; errEl.style.display='block'; return; }
 firebase.database().ref('channel_list/'+id).once('value').then(snap=>{
   if(snap.exists()){ errEl.textContent='Canal já existe'; errEl.style.display='block'; return; }
   const label = '# '+id;
   let data = {id:id, label:label, createdBy: currentUser.id, createdAt: Date.now(), isPublic: channelType==='public'};
   if(channelType==='private'){
     const checks = document.querySelectorAll('#membersChecklist input:checked');
     let members = {}; members[currentUser.id]=true;
     checks.forEach(c=>{ members[c.value]=true; });
     data.members = members;
   }
   firebase.database().ref('channel_list/'+id).set(data).then(()=>{ closeCreateChannelModal(); selectChannel(id, label, 'channel'); }).catch(e=>{ errEl.textContent='Erro: '+e.message; errEl.style.display='block'; });
 });
}
function deleteChannel(id, label){
 if(id==='geral'){ alert('Não pode excluir #geral'); return; }
 if(!confirm('Excluir canal '+label+'?')) return;
 firebase.database().ref('channel_list/'+id).remove();
 firebase.database().ref('channels/'+id).remove();
 if(currentChannel===id) selectChannel('geral','# geral','channel');
}
let editingChannelId=null;
function openManageMembers(chanId=null){
 editingChannelId = chanId || currentChannel;
 if(!editingChannelId || currentChannelType==='dm'){ alert('Selecione um canal'); return; }
 const ch = allChannelsCache[editingChannelId];
 if(!ch){ alert('Canal não encontrado'); return; }
 document.getElementById('manageTitle').textContent='Membros de '+ch.label;
 document.getElementById('manageMembersModal').style.display='flex';
 const cont=document.getElementById('manageChecklist');
 cont.innerHTML='';
 const members = ch.members || null;
 const list = [{id:currentUser.id, nome:currentUser.nome+' (você)'}, ... (window.allUsers||[]).filter(u=>u.id!==currentUser.id)];
 list.forEach(u=>{
   const nome=u.nome||u.email;
   const isMember = !members || members[u.id] || u.id===currentUser.id;
   const div=document.createElement('div'); div.style.cssText='display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px';
   div.innerHTML=`<input type="checkbox" value="${u.id}" id="mchk_${u.id}" ${isMember?'checked':''} style="width:auto" ${u.id===currentUser.id?'disabled':''}><label for="mchk_${u.id}" style="margin:0;color:#d1d5db;flex:1">${nome}</label>`;
   cont.appendChild(div);
 });
}
function closeManageMembers(){ document.getElementById('manageMembersModal').style.display='none'; editingChannelId=null; }
function saveMembers(){
 if(!editingChannelId) return;
 const checks = document.querySelectorAll('#manageChecklist input:checked');
 let members = {}; checks.forEach(c=>{ members[c.value]=true; }); members[currentUser.id]=true;
 if(Object.keys(members).length<=1){ if(confirm('Deixar canal público?')){ firebase.database().ref('channel_list/'+editingChannelId+'/members').remove(); closeManageMembers(); return; } }
 firebase.database().ref('channel_list/'+editingChannelId+'/members').set(members);
 closeManageMembers();
}
function selectChannel(id,label,type='channel'){
 if(listeners.msg){ listeners.msg.off('child_added'); listeners.msg.off('child_removed'); }
 if(readsListener){ readsListener.off(); readsListener=null; }
 currentChannel=id; currentChannelType=type; messagesCache={}; readsCache={};
 document.getElementById('chatTitle').textContent=label;
 const ch = allChannelsCache[id];
 const sub=document.getElementById('chatSub');
 if(type==='dm'){ sub.textContent='💬 Privada'; sub.style.color='#6366f1'; document.getElementById('manageMembersBtn').style.display='none'; }
 else { if(ch && ch.members){ sub.textContent='🔒 '+Object.keys(ch.members).length+' membros'; sub.style.color='#f59e0b'; } else sub.textContent='● Público (seguro)'; document.getElementById('manageMembersBtn').style.display='block'; }
 document.getElementById('msgs').innerHTML='';
 clearUnread(id);
 let basePath = type==='dm' ? 'dms/'+id : 'channels/'+id;
 if(!isAdmin() && type==='channel' && ch && ch.members && !ch.members[currentUser.id] && ch.createdBy!==currentUser.id){ document.getElementById('msgs').innerHTML='<div style="text-align:center;padding:40px;color:#64748b">🔒 Sem acesso (regra segura)</div>'; return; }
 const ref=firebase.database().ref(basePath+'/messages').limitToLast(150);
 listeners.msg=ref;
 ref.on('child_added',snap=>{ const m=snap.val(); if(!m) return; messagesCache[snap.key]=m; addMsg(m, snap.key); if(m.userId!==currentUser.id){ setTimeout(()=>markAsRead(),500); } }, err=>{ if(err.code==='PERMISSION_DENIED'){ document.getElementById('msgs').innerHTML='<div style="text-align:center;padding:40px;color:#ef4444">⛔ Sem permissão - canal privado</div>'; } });
 ref.on('child_removed',snap=>{ const el=document.getElementById('msg-'+snap.key); if(el) el.remove(); delete messagesCache[snap.key]; });
 const readsRef=firebase.database().ref(basePath+'/reads');
 readsListener=readsRef;
 readsRef.on('value', snap=>{ readsCache=snap.val()||{}; Object.keys(messagesCache).forEach(k=>{ updateReadStatus(k, messagesCache[k]); }); });
 setTimeout(()=>markAsRead(),1000);
}
function markAsRead(){
 if(!currentUser) return;
 let basePath = currentChannelType==='dm' ? 'dms/'+currentChannel : 'channels/'+currentChannel;
 const lastKey = Object.keys(messagesCache).length ? Object.keys(messagesCache)[Object.keys(messagesCache).length-1] : null;
 const lastMsg = lastKey ? messagesCache[lastKey] : null;
 const data = {userId: currentUser.id, nome: currentUser.nome, timestamp: Date.now(), lastMessageId: lastKey||'', lastMessageTime: lastMsg ? lastMsg.timestamp : Date.now()};
 firebase.database().ref(basePath+'/reads/'+currentUser.id).set(data);
}
function getReadStatus(msgKey, msg){
 if(!msg || msg.userId!==currentUser.id) return null;
 const reads = Object.values(readsCache).filter(r=>r.userId!==currentUser.id);
 if(reads.length===0) return {icon:'✓', text:'Enviado', cls:'read-sent'};
 let seenBy=[];
 reads.forEach(r=>{ if(r.lastMessageTime && r.lastMessageTime >= msg.timestamp) seenBy.push(r); });
 if(seenBy.length===0) return {icon:'✓✓', text:'Entregue', cls:'read-delivered'};
 if(currentChannelType==='dm'){ return {icon:'✓✓', text:'Visualizado por '+seenBy[0].nome, cls:'read-seen-blue'}; }
 else { if(seenBy.length===1) return {icon:'✓✓', text:'Visto por '+seenBy[0].nome, cls:'read-seen'}; return {icon:'✓✓', text:'Visto por '+seenBy.length, cls:'read-seen'}; }
}
function updateReadStatus(msgKey, msg){
 const el=document.getElementById('read-'+msgKey);
 if(!el) return;
 const status=getReadStatus(msgKey, msg);
 if(!status){ el.innerHTML=''; return; }
 el.innerHTML=`<span class="${status.cls}">${status.icon} ${status.text}</span>`;
}
function selectUser(u){
 const ids=[currentUser.id,u.id].sort(); const dmId=ids.join('_');
 selectChannel(dmId,'💬 '+ (u.nome||u.email), 'dm');
 document.getElementById('chatTitle').textContent='💬 '+ (u.nome||u.email);
}
function addMsg(m, key){
 if(!m) return;
 const msgKey = key || m.id;
 if(document.getElementById('msg-'+msgKey)) return;
 const box=document.getElementById('msgs');
 const wrap=document.createElement('div'); wrap.id='msg-'+msgKey; wrap.className='msg-wrap';
 const isMe=m.userId===currentUser.id;
 const nome=m.user||m.nome||'Usuario';
 let content = '';
 if(m.text) content+=`<div style="margin-top:4px;background:${isMe?'#eef2ff':'white'};border:1px solid #e2e8f0;padding:10px 12px;border-radius:12px;font-size:14px;color:#1e293b;max-width:520px;word-break:break-word">${escapeHtml(m.text)}</div>`;
 if(m.fileUrl){
   const isImage = m.fileType && m.fileType.startsWith('image/');
   if(isImage) content+=`<a href="${m.fileUrl}" target="_blank"><img src="${m.fileUrl}" style="max-width:200px;max-height:200px;border-radius:10px;margin-top:8px;border:1px solid #e2e8f0" loading="lazy"></a>`;
   else content+=`<div style="display:flex;align-items:center;gap:10px;background:#f1f5f9;padding:10px;border-radius:10px;margin-top:8px;border:1px solid #e2e8f0"><div style="font-size:24px">📄</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#111827">${m.fileName||'arquivo'}</div></div><a href="${m.fileUrl}" target="_blank" download style="padding:6px 12px;background:#6366f1;color:white;border-radius:8px;text-decoration:none;font-size:12px">Baixar</a></div>`;
 }
 const canDelete = isMe || isAdmin();
 const delBtn = canDelete ? `<div class="msg-actions"><button class="del-btn" onclick="deleteMsg('${msgKey}')">🗑️ ${isAdmin()&&!isMe?'Admin':''}</button></div>` : '';
 const status = getReadStatus(msgKey, m);
 const statusHtml = status && isMe ? `<div id="read-${msgKey}" class="read-status"><span class="${status.cls}">${status.icon} ${status.text}</span></div>` : (isMe ? `<div id="read-${msgKey}" class="read-status"><span class="read-sent">✓ Enviado</span></div>` : '');
 wrap.innerHTML=`<div style="width:36px;height:36px;border-radius:50%;background:${m.avatarColor||'#6366f1'};display:grid;place-items:center;color:white;font-weight:700;flex-shrink:0">${nome[0].toUpperCase()}</div><div><div style="display:flex;gap:8px;align-items:center"><b style="font-size:14px;color:#111827">${escapeHtml(nome)}</b><span style="font-size:11px;color:#64748b">${m.timestamp?new Date(m.timestamp).toLocaleTimeString():''}</span>${delBtn}</div>${content}${statusHtml}</div>`;
 box.appendChild(wrap); box.scrollTop=box.scrollHeight;
}
let pendingFile=null;
function showFilePreview(file){
 if(file.size>15*1024*1024){ alert('Arquivo muito grande (max 15MB nas regras seguras)'); return; }
 pendingFile=file;
 const modal=document.getElementById('filePreviewModal');
 const img=document.getElementById('previewImg');
 const icon=document.getElementById('previewFileIcon');
 const nameEl=document.getElementById('previewFileName');
 const sizeEl=document.getElementById('previewFileSize');
 document.getElementById('previewCaption').value='';
 if(file.type.startsWith('image/')){
   const reader=new FileReader();
   reader.onload=(e)=>{ img.src=e.target.result; img.style.display='block'; icon.style.display='none'; };
   reader.readAsDataURL(file);
 } else {
   img.style.display='none'; icon.style.display='block';
   nameEl.textContent=file.name; sizeEl.textContent=(file.size/1024).toFixed(1)+' KB';
 }
 modal.style.display='flex';
}
function cancelFilePreview(){ pendingFile=null; document.getElementById('filePreviewModal').style.display='none'; }
function confirmFileSend(){
 if(!pendingFile) return;
 const caption=document.getElementById('previewCaption').value.trim();
 document.getElementById('filePreviewModal').style.display='none';
 uploadFile(pendingFile, caption);
 pendingFile=null;
}
function escapeHtml(t){return (t||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sendMsg(){
 const input=document.getElementById('msgInput');const text=input.value.trim(); if(!text) return;
 if(text.length>2000){ alert('Mensagem muito longa (max 2000 caracteres nas regras seguras)'); return; }
 let path = currentChannelType==='dm' ? 'dms/'+currentChannel+'/messages' : 'channels/'+currentChannel+'/messages';
 const ref=firebase.database().ref(path).push();
 ref.set({id:ref.key,text,user:currentUser.nome,userId:currentUser.id,cargo:currentUser.cargo,avatarColor:currentUser.avatarColor,timestamp:Date.now()}).catch(e=>{ alert('Sem permissão: '+e.message); });
 input.value='';input.focus();
}
async function uploadFile(file, captionText=""){
 if(file.size>15*1024*1024) return alert('Muito grande - max 15MB nas regras');
 const info=document.getElementById('uploadInfo'); const txt=document.getElementById('uploadText'); const bar=document.getElementById('progressBar');
 info.style.display='block'; txt.textContent='Enviando '+file.name+'...'; bar.style.width='15%';
 if(file.size < 3*1024*1024){
   const reader=new FileReader();
   reader.onload=async (e)=>{
     try{
       bar.style.width='70%';
       let path = currentChannelType==='dm' ? 'dms/'+currentChannel+'/messages' : 'channels/'+currentChannel+'/messages';
       const ref=firebase.database().ref(path).push();
       await ref.set({id:ref.key,text:captionText||'',fileUrl:e.target.result,fileName:file.name,fileType:file.type,fileSize:file.size,user:currentUser.nome,userId:currentUser.id,avatarColor:currentUser.avatarColor,timestamp:Date.now(),isBase64:true});
       bar.style.width='100%'; setTimeout(()=>info.style.display='none',800);
     }catch(err){ info.style.display='none'; alert('Erro: '+err.message); }
   };
   reader.readAsDataURL(file); return;
 }
 try{
  const storageRef=firebase.storage().ref('chat_files/'+currentChannel+'/'+Date.now()+'_'+file.name);
  const task=storageRef.put(file);
  task.on('state_changed', snap=>{ const pct=(snap.bytesTransferred/snap.totalBytes*100).toFixed(0); bar.style.width=pct+'%'; txt.textContent='Enviando '+pct+'%'; }, err=>{ info.style.display='none'; alert('Erro storage (verifique regras): '+err.message); }, async ()=>{
   const url=await task.snapshot.ref.getDownloadURL();
   let path = currentChannelType==='dm' ? 'dms/'+currentChannel+'/messages' : 'channels/'+currentChannel+'/messages';
   const ref=firebase.database().ref(path).push();
   await ref.set({id:ref.key,text:captionText||'',fileUrl:url,fileName:file.name,fileType:file.type,fileSize:file.size,user:currentUser.nome,userId:currentUser.id,avatarColor:currentUser.avatarColor,timestamp:Date.now()});
   setTimeout(()=>info.style.display='none',600);
  });
 }catch(e){ info.style.display='none'; alert('Erro: '+e.message); }
}
function deleteMsg(msgKey){
 if(!confirm('Excluir esta mensagem?')) return;
 const m=messagesCache[msgKey];
 if(m && m.userId !== currentUser.id && !isAdmin()){ alert('Só pode excluir suas'); return; }
 let path = currentChannelType==='dm' ? 'dms/'+currentChannel+'/messages/'+msgKey : 'channels/'+currentChannel+'/messages/'+msgKey;
 firebase.database().ref(path).remove().then(()=>{ const el=document.getElementById('msg-'+msgKey); if(el) el.remove(); }).catch(e=>{ alert('Sem permissão: '+e.message); });
}
function toggleNotifications(){
 if(Notification && Notification.permission!=='granted'){
   Notification.requestPermission().then(p=>{ notifPermission=p==='granted'; notifSoundEnabled=true; updateNotifBtn(); });
 } else {
   notifSoundEnabled=!notifSoundEnabled; updateNotifBtn(); if(notifSoundEnabled) playNotifSound();
 }
}
function updateNotifBtn(){ const btn=document.getElementById('notifBtn'); if(!btn) return; btn.textContent=notifSoundEnabled?'🔔':'🔕'; }
function playNotifSound(){
 try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.3, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.3); o.start(); o.stop(ctx.currentTime+0.3); }catch(e){}
}
function showBrowserNotification(title, body, channelId){
 if(!notifPermission || Notification.permission!=='granted') return;
 if(!document.hidden && currentChannel===channelId) return;
 try{ const n=new Notification(title, {body: body}); n.onclick=()=>{ window.focus(); if(channelId){ const ch=allChannelsCache[channelId]; if(ch) selectChannel(channelId, ch.label, 'channel'); else selectChannel(channelId, '#'+channelId, 'channel'); } n.close(); }; setTimeout(()=>n.close(),6000); }catch(e){}
}
function setupGlobalNotifications(){
 if(Notification && Notification.permission==='default'){ Notification.requestPermission().then(p=>{ notifPermission=p==='granted'; }); }
 else if(Notification && Notification.permission==='granted') notifPermission=true;
 notifSoundEnabled=true; updateNotifBtn();
 firebase.database().ref('channel_list').on('value', snap=>{
   const chans=snap.val()||{};
   Object.keys(chans).forEach(cid=>{
     const ch=chans[cid];
     if(!isAdmin() && ch.members && !ch.members[currentUser.id] && ch.createdBy!==currentUser.id) return;
     if(globalNotifiers[cid]) return;
     const ref=firebase.database().ref('channels/'+cid+'/messages').limitToLast(1);
     globalNotifiers[cid]=ref;
     ref.on('child_added', s=>{
       const m=s.val(); if(!m) return;
       if(m.userId===currentUser.id) return;
       if(!initialLoadDone) return;
       if(Date.now() - m.timestamp > 10000) return;
       if(cid===currentChannel && !document.hidden) return;
       unreadCounts[cid]=(unreadCounts[cid]||0)+1;
       renderChannelList(allChannelsCache);
       const preview = m.text ? m.text.substring(0,60) : (m.fileName ? '📎 '+m.fileName : 'Nova mensagem');
       showBrowserNotification((ch.label||'#'+cid)+' - '+m.user, preview, cid);
       playNotifSound();
     });
   });
 });
 firebase.database().ref('dms').on('child_added', snap=>{
   const dmId=snap.key;
   if(!dmId.includes(currentUser.id)) return;
   if(globalNotifiers['dm_'+dmId]) return;
   const ref=firebase.database().ref('dms/'+dmId+'/messages').limitToLast(1);
   globalNotifiers['dm_'+dmId]=ref;
   ref.on('child_added', s=>{
     const m=s.val(); if(!m) return;
     if(m.userId===currentUser.id) return;
     if(!initialLoadDone) return;
     if(Date.now() - m.timestamp > 10000) return;
     if(dmId===currentChannel && !document.hidden) return;
     unreadCounts[dmId]=(unreadCounts[dmId]||0)+1;
     renderUsers(); renderChannelList(allChannelsCache);
     const preview = m.text ? m.text.substring(0,60) : '📎 Arquivo';
     showBrowserNotification('💬 '+m.user, preview, dmId);
     playNotifSound();
   });
 });
 setTimeout(()=>{ initialLoadDone=true; }, 4000);
}
function clearUnread(channelId){ if(unreadCounts[channelId]){ delete unreadCounts[channelId]; renderChannelList(allChannelsCache); renderUsers(); updateTotalUnread(); } }
function openAdminPanel(){ if(!isAdmin()){ alert('Acesso negado - só admin'); return; } document.getElementById('adminPanelModal').style.display='flex'; switchAdminTab('users'); }
function closeAdminPanel(){ document.getElementById('adminPanelModal').style.display='none'; }
function switchAdminTab(tab){
 document.getElementById('adminTabUsers').style.background=tab==='users'?'#6366f122':'#0f172a';
 document.getElementById('adminTabUsers').style.borderColor=tab==='users'?'#6366f1':'#334155';
 document.getElementById('adminTabChannels').style.background=tab==='channels'?'#6366f122':'#0f172a';
 document.getElementById('adminTabChannels').style.borderColor=tab==='channels'?'#6366f1':'#334155';
 document.getElementById('adminTabMessages').style.background=tab==='messages'?'#6366f122':'#0f172a';
 document.getElementById('adminTabMessages').style.borderColor=tab==='messages'?'#6366f1':'#334155';
 if(tab==='users') renderAdminUsers();
 if(tab==='channels') renderAdminChannels();
 if(tab==='messages') renderAdminMessages();
}
function renderAdminUsers(){
 const cont=document.getElementById('adminTabContent');
 const users = window.allUsers ? [...window.allUsers, currentUser] : [currentUser];
 const map={}; users.forEach(u=>{ if(u && u.id) map[u.id]=u; });
 const list=Object.values(map);
 document.getElementById('adminUserCount').textContent=list.length;
 cont.innerHTML=`<div style="margin-bottom:12px;font-size:13px;color:#94a3b8">Regras seguras ativas - só admin pode editar outros</div>`;
 list.sort((a,b)=> (a.email||'').localeCompare(b.email||'')).forEach(u=>{
   const isSelf = u.id===currentUser.id;
   const isAdminUser = ADMIN_EMAILS.includes((u.email||'').toLowerCase());
   const online = isUserOnline(u);
   const div=document.createElement('div');
   div.style.cssText='display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #334155;border-radius:10px;margin-bottom:8px;background:#0f172a';
   div.innerHTML=`<div style="width:40px;height:40px;border-radius:50%;background:${u.avatarColor||'#6366f1'};display:grid;place-items:center;color:white;font-weight:700">${(u.nome||'U')[0].toUpperCase()}</div><div style="flex:1"><div style="font-weight:600;color:white">${u.nome||'Sem nome'} ${isAdminUser?'<span style="background:#7c3aed;color:white;font-size:10px;padding:2px 6px;border-radius:4px">ADMIN</span>':''}</div><div style="font-size:12px;color:#94a3b8">${u.email||''}</div><div style="font-size:11px;color:${online?'#22c55e':'#6b7280'}">${online?'🟢 online':'⚫ '+formatLastSeen(u.lastSeen||u.lastActive)}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button onclick="openEditUser('${u.id}')" style="padding:6px 12px;border-radius:6px;border:1px solid #334155;background:#1f2937;color:#94a3b8;cursor:pointer;font-size:12px">✏️</button><button onclick="adminDeleteUser('${u.id}','${(u.nome||'').replace(/'/g,"")}')" style="padding:6px 12px;border-radius:6px;border:1px solid #7f1d1d;background:#7f1d1d22;color:#f87171;cursor:pointer;font-size:12px" ${isSelf?'disabled':''}>🗑️</button></div>`;
   cont.appendChild(div);
 });
}
function openEditUser(userId){
 const users = window.allUsers ? [...window.allUsers, currentUser] : [currentUser];
 const u = users.find(x=>x && x.id===userId) || (currentUser.id===userId?currentUser:null);
 if(!u){ alert('Não encontrado'); return; }
 document.getElementById('editUserId').value=u.id;
 document.getElementById('editUserNome').value=u.nome||'';
 document.getElementById('editUserCargo').value=u.cargo||'';
 document.getElementById('editUserEmail').value=u.email||'';
 document.getElementById('editUserColor').value=u.avatarColor||'#6366f1';
 document.getElementById('editUserErr').style.display='none';
 document.getElementById('editUserModal').style.display='flex';
}
function closeEditUser(){ document.getElementById('editUserModal').style.display='none'; }
function saveEditUser(){
 const id=document.getElementById('editUserId').value;
 const nome=document.getElementById('editUserNome').value.trim();
 const cargo=document.getElementById('editUserCargo').value.trim();
 const color=document.getElementById('editUserColor').value;
 if(nome.length<2){ document.getElementById('editUserErr').textContent='Nome muito curto'; document.getElementById('editUserErr').style.display='block'; return; }
 firebase.database().ref('users/'+id).update({nome:nome, cargo:cargo, avatarColor:color}).then(()=>{ closeEditUser(); alert('Atualizado!'); }).catch(e=>{ document.getElementById('editUserErr').textContent='Sem permissão: '+e.message; document.getElementById('editUserErr').style.display='block'; });
}
function adminDeleteUser(userId, nome){
 if(userId===currentUser.id){ alert('Não pode excluir a si mesmo'); return; }
 if(!confirm('Excluir usuário '+nome+'?')) return;
 firebase.database().ref('users/'+userId).remove().then(()=>{ alert('Excluído!'); renderAdminUsers(); }).catch(e=>{ alert('Sem permissão: '+e.message); });
}
function renderAdminChannels(){
 const cont=document.getElementById('adminTabContent');
 const chans = allChannelsCache || {};
 const list=Object.values(chans);
 cont.innerHTML=`<div style="margin-bottom:12px;font-size:13px;color:#94a3b8">Total: ${list.length} canais - regras seguras</div>`;
 list.forEach(ch=>{
   const div=document.createElement('div');
   div.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #334155;border-radius:10px;margin-bottom:8px;background:#0f172a';
   const isPrivate = ch.members ? '🔒 Privado (só membros leem)' : '🌐 Público (só logado)';
   div.innerHTML=`<div><div style="font-weight:600;color:white">${ch.label} <span style="font-size:11px;color:#94a3b8">${isPrivate}</span></div><div style="font-size:11px;color:#6b7280">ID: ${ch.id}</div></div><div style="display:flex;gap:6px"><button onclick="selectChannel('${ch.id}','${ch.label}','channel'); closeAdminPanel(); closeSidebar();" style="padding:6px 12px;border-radius:6px;border:1px solid #334155;background:#1f2937;color:#94a3b8;cursor:pointer;font-size:12px">Abrir</button><button onclick="deleteChannel('${ch.id}','${ch.label}')" style="padding:6px 12px;border-radius:6px;border:1px solid #7f1d1d;background:#7f1d1d22;color:#f87171;cursor:pointer;font-size:12px" ${ch.id==='geral'?'disabled':''}>🗑️</button></div>`;
   cont.appendChild(div);
 });
}
function renderAdminMessages(){
 const cont=document.getElementById('adminTabContent');
 cont.innerHTML=`<div style="padding:12px;background:#22c55e22;border:1px solid #22c55e44;border-radius:10px;margin-bottom:12px"><div style="font-weight:600;color:white;margin-bottom:6px">🔒 Regras seguras ativas:</div><ul style="font-size:13px;color:#d1d5db;margin-left:16px"><li>✓ Só logado pode ler/escrever</li><li>✓ Mensagem só com seu próprio userId</li><li>✓ Canal privado só membros leem</li><li>✓ DM só participantes leem</li><li>✓ Arquivo max 15MB</li><li>✓ Texto max 2000 chars</li><li>✓ Usuário só edita a si mesmo (admin edita todos)</li></ul></div><button onclick="if(confirm('Limpar TODAS as mensagens?')){ firebase.database().ref('channels').remove(); firebase.database().ref('dms').remove(); alert('Apagadas!'); }" style="width:100%;padding:12px;border-radius:10px;border:1px solid #7f1d1d;background:#7f1d1d22;color:#f87171;cursor:pointer;font-weight:600">⚠️ Limpar todas as mensagens</button>`;
}
async function doLogout(){
 try{ if(currentUser){ await firebase.database().ref('users/'+currentUser.id).update({online:false, lastSeen: firebase.database.ServerValue.TIMESTAMP, lastActive:0}); await firebase.database().ref('users/'+currentUser.id).onDisconnect().cancel(); } }catch(e){}
 await firebase.auth().signOut(); location.reload();
}
setTimeout(initFirebase,400);
</script>
