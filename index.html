<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect Elgin - Completo com Visualizado</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0f172a;color:#e2e8f0}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px at 20% 10%, #6366f122, transparent),radial-gradient(600px at 80% 90%, #06b6d422, transparent),#0f172a}
.card{width:100%;max-width:440px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:28px;box-shadow:0 20px 60px #0005}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo .dot{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;font-weight:800;color:white}
.tabs{display:flex;background:#0f172a;border-radius:10px;padding:4px;margin-bottom:18px}
.tab{flex:1;padding:10px;border-radius:8px;text-align:center;cursor:pointer;color:#94a3b8;font-weight:600}
.tab.active{background:#334155;color:white}
label{font-size:13px;color:#94a3b8;margin:12px 0 6px;display:block}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;outline:none}
input:focus{border-color:#6366f1}
.btn{width:100%;padding:13px;border-radius:10px;border:none;background:#6366f1;color:white;font-weight:700;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.6}
.colors{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.color{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color.sel{border-color:white;box-shadow:0 0 0 2px #6366f1}
.err{background:#7f1d1d33;border:1px solid #7f1d1d;color:#fecaca;padding:10px;border-radius:10px;font-size:13px;margin-top:12px;display:none}
.ok{color:#22c55e;font-size:12px;margin-top:10px}
#chatScreen{display:none;height:100vh;flex-direction:row}
.side{width:320px;background:#111827;border-right:1px solid #1f2937;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;background:#f8fafc}
#msgInput{background:#ffffff !important;color:#111827 !important;-webkit-text-fill-color:#111827 !important;caret-color:#111827 !important}
#msgInput::placeholder{color:#9ca3af !important}
.msg-wrap{position:relative; display:flex; gap:10px; margin-bottom:18px}
.msg-wrap:hover .msg-actions{opacity:1}
.msg-actions{opacity:0; transition:.2s; display:flex; gap:6px; margin-left:8px}
.del-btn{background:#fee2e2;border:1px solid #fecaca;color:#dc2626;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px}
.badge{background:#ef4444;color:white;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.badge-channel{background:#6366f1}
.badge-dm{background:#ef4444}
.read-status{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:4px}
.read-sent{color:#94a3b8}
.read-delivered{color:#64748b}
.read-seen{color:#22c55e;font-weight:600}
.read-seen-blue{color:#0ea5e9;font-weight:700}
</style>
</head>
<body>
<div id="loginScreen">
<div class="card">
<div class="logo"><div class="dot">C</div><div><b>Connect Elgin</b><div style="font-size:12px;color:#94a3b8">Entre ou crie sua conta</div></div></div>
<div class="tabs"><div id="tabLogin" class="tab active" onclick="switchTab('login')">Entrar</div><div id="tabReg" class="tab" onclick="switchTab('reg')">Criar conta</div></div>
<div id="formLogin">
<label>Email</label><input id="l_email" placeholder="seu@elgin.com.br" type="email">
<label>Senha</label><input id="l_senha" placeholder="Sua senha" type="password">
<div id="l_err" class="err"></div>
<button id="btnLogin" class="btn">Entrar no Connect</button>
<div style="text-align:center;margin-top:12px;font-size:13px;color:#94a3b8">Primeiro acesso? <span style="color:#6366f1;cursor:pointer" onclick="switchTab('reg')">Criar conta</span></div>
</div>
<div id="formReg" style="display:none">
<label>Nome completo</label><input id="r_nome" placeholder="Ex: João Silva">
<label>Cargo</label><input id="r_cargo" placeholder="Ex: Marketing" value="Colaborador">
<label>Email</label><input id="r_email" placeholder="seu@elgin.com.br" type="email">
<label>Senha (min 6)</label><input id="r_senha" type="password" placeholder="Crie uma senha">
<label>Confirmar senha</label><input id="r_senha2" type="password" placeholder="Repita a senha">
<label>Cor do avatar</label><div class="colors" id="colorPick"></div>
<div id="r_err" class="err"></div>
<button id="btnReg" class="btn">Criar conta e entrar</button>
<div style="text-align:center;margin-top:12px;font-size:13px;color:#94a3b8">Já tem conta? <span style="color:#6366f1;cursor:pointer" onclick="switchTab('login')">Entrar</span></div>
</div>
<div id="status" class="ok">Carregando Firebase...</div>
</div>
</div>

<div id="chatScreen">
<div class="side" id="sidebar">
<div style="padding:18px;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center"><b style="color:white">Connect</b><div style="display:flex;gap:6px"><button id="notifBtn" onclick="toggleNotifications()" style="background:#1f2937;color:#94a3b8;border:none;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px">🔔</button><button onclick="doLogout()" style="background:#1f2937;color:#94a3b8;border:none;padding:6px 10px;border-radius:8px;cursor:pointer">Sair</button></div></div>
<div style="padding:12px"><div style="font-size:11px;color:#6b7280;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><span>CANAIS</span><button onclick="openCreateChannelModal()" style="width:22px;height:22px;border-radius:6px;border:1px solid #2a3441;background:#1f2937;color:#9ca3af;cursor:pointer;font-weight:700">+</button></div><div id="chanList"></div></div>
<div style="padding:12px;flex:1;overflow:auto"><div style="font-size:11px;color:#6b7280;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between"><span>EQUIPE</span><span id="totalUnread" style="display:none" class="badge">0</span></div><input id="search" placeholder="Buscar usuários..." style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #1f2937;background:#0f172a;color:white;margin-bottom:10px"><div id="userList"></div><div id="conn" style="font-size:11px;color:#6b7280;margin-top:10px"></div></div>
</div>
<div class="main">
<div style="height:60px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 18px;justify-content:space-between;background:white"><div><b id="chatTitle">#geral</b><div id="chatSub" style="font-size:12px;color:#64748b">Realtime</div></div><div style="display:flex;gap:8px"><button id="manageMembersBtn" onclick="openManageMembers()" style="display:none;padding:6px 12px;border-radius:8px;border:1px solid #e2e8f0;background:white;color:#6366f1;cursor:pointer;font-size:12px">👥 Membros</button><button onclick="selectChannel('geral','# geral','channel')" style="padding:6px 12px;border-radius:8px;border:1px solid #e2e8f0;background:white;color:#6366f1;cursor:pointer;font-size:12px">Voltar #geral</button></div></div>
<div id="msgs" style="flex:1;overflow:auto;padding:18px;background:#f8fafc"></div>

<div id="filePreviewModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;padding:20px">
<div style="background:white;border-radius:16px;max-width:420px;width:100%;overflow:hidden">
<div style="padding:16px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center"><b style="color:#111827">Enviar arquivo?</b><button onclick="cancelFilePreview()" style="width:32px;height:32px;border-radius:8px;border:1px solid #e2e8f0;background:#f8fafc;cursor:pointer">✕</button></div>
<div style="padding:16px">
<img id="previewImg" style="display:none;max-width:100%;max-height:240px;border-radius:12px;margin:0 auto 12px;border:1px solid #e2e8f0">
<div id="previewFileIcon" style="display:none;text-align:center;padding:20px"><div style="font-size:48px">📄</div><div id="previewFileName" style="font-weight:600;color:#111827;margin-top:8px"></div><div id="previewFileSize" style="font-size:12px;color:#64748b"></div></div>
<input id="previewCaption" placeholder="Legenda opcional..." style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid #e2e8f0;background:#ffffff;color:#111827;margin-top:12px">
</div>
<div style="padding:12px 16px;background:#f8fafc;display:flex;gap:10px;justify-content:flex-end"><button onclick="cancelFilePreview()" style="padding:10px 16px;border-radius:10px;border:1px solid #e2e8f0;background:white;color:#64748b;cursor:pointer">Cancelar</button><button onclick="confirmFileSend()" style="padding:10px 20px;border-radius:10px;border:none;background:#6366f1;color:white;cursor:pointer;font-weight:700">📤 Enviar</button></div>
</div>
</div>

<div id="createChannelModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9998;align-items:center;justify-content:center;padding:20px">
<div style="background:#1e293b;border:1px solid #334155;border-radius:16px;max-width:420px;width:100%;overflow:hidden">
<div style="padding:16px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center"><b style="color:white">Criar canal</b><button onclick="closeCreateChannelModal()" style="width:32px;height:32px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer">✕</button></div>
<div style="padding:16px;max-height:70vh;overflow:auto">
<input id="newChannelName" placeholder="Ex: ti, financeiro" style="width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white">
<div style="display:flex;gap:8px;margin:12px 0"><button id="typePublic" onclick="setChannelType('public')" style="flex:1;padding:8px;border-radius:8px;border:1px solid #6366f1;background:#6366f122;color:white;font-size:13px;cursor:pointer">🌐 Público</button><button id="typePrivate" onclick="setChannelType('private')" style="flex:1;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#94a3b8;font-size:13px;cursor:pointer">🔒 Privado</button></div>
<div id="membersSection" style="display:none">
<label style="font-size:13px;margin-bottom:6px;display:block">Atribuir pessoas:</label>
<div id="membersChecklist" style="max-height:180px;overflow:auto;border:1px solid #334155;border-radius:10px;padding:8px;background:#0f172a"></div>
</div>
<div id="createChanErr" style="display:none;background:#7f1d1d33;border:1px solid #7f1d1d;color:#fecaca;padding:8px;border-radius:8px;font-size:12px;margin-top:10px"></div>
</div>
<div style="padding:12px 16px;background:#0f172a;display:flex;gap:10px;justify-content:flex-end"><button onclick="closeCreateChannelModal()" style="padding:10px 16px;border-radius:10px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer">Cancelar</button><button onclick="createChannel()" style="padding:10px 20px;border-radius:10px;border:none;background:#6366f1;color:white;cursor:pointer;font-weight:700">Criar</button></div>
</div>
</div>

<div id="manageMembersModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9997;align-items:center;justify-content:center;padding:20px">
<div style="background:#1e293b;border:1px solid #334155;border-radius:16px;max-width:420px;width:100%;overflow:hidden">
<div style="padding:16px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center"><b style="color:white" id="manageTitle">Gerenciar membros</b><button onclick="closeManageMembers()" style="width:32px;height:32px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer">✕</button></div>
<div style="padding:16px;max-height:60vh;overflow:auto"><div id="manageChecklist" style="border:1px solid #334155;border-radius:10px;padding:8px;background:#0f172a;max-height:300px;overflow:auto"></div></div>
<div style="padding:12px 16px;background:#0f172a;display:flex;gap:10px;justify-content:flex-end"><button onclick="closeManageMembers()" style="padding:10px 16px;border-radius:10px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer">Cancelar</button><button onclick="saveMembers()" style="padding:10px 20px;border-radius:10px;border:none;background:#6366f1;color:white;cursor:pointer">Salvar</button></div>
</div>
</div>

<div id="uploadInfo" style="padding:8px 14px;background:#eef2ff;border-top:1px solid #e2e8f0;display:none"><div id="uploadText" style="font-size:13px;color:#4338ca"></div><div style="height:4px;background:#e2e8f0;border-radius:2px;margin-top:6px;overflow:hidden"><div id="progressBar" style="height:100%;background:#6366f1;width:0%;transition:.2s"></div></div></div>
<audio id="notifSound" preload="auto"></audio>
<form id="msgForm" style="padding:14px;background:white;border-top:1px solid #e2e8f0;display:flex;gap:10px;align-items:center"><button type="button" id="attachBtn" style="width:44px;height:44px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;cursor:pointer;font-size:20px;flex-shrink:0">📎</button><input type="file" id="fileInput" style="display:none"><input id="msgInput" placeholder="Digite uma mensagem..." style="flex:1;padding:12px 14px;border-radius:10px;border:1px solid #e2e8f0;background:#ffffff;color:#111827"><button type="submit" style="padding:12px 18px;border-radius:10px;border:none;background:#6366f1;color:white;font-weight:700">Enviar</button></form>
</div>
</div>

<script>
const colors=["#6366f1","#06b6d4","#f59e0b","#10b981","#ec4899","#8b5cf6"]; let selColor=colors[0];
const cp=document.getElementById('colorPick'); colors.forEach(c=>{const d=document.createElement('div');d.className='color'+(c===selColor?' sel':'');d.style.background=c;d.onclick=()=>{selColor=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));d.classList.add('sel')};cp.appendChild(d)});
function switchTab(t){document.getElementById('formLogin').style.display=t==='login'?'block':'none';document.getElementById('formReg').style.display=t==='reg'?'block':'none';document.getElementById('tabLogin').classList.toggle('active',t==='login');document.getElementById('tabReg').classList.toggle('active',t==='reg')}
window.onerror=(m)=>{document.getElementById('status').textContent='Erro: '+m;document.getElementById('status').style.color='#f87171'}
const firebaseConfig={apiKey:"AIzaSyA7RDUiCwBu8ilgOPyv-HcD_TTpujAoJio",authDomain:"chat-elgin.firebaseapp.com",databaseURL:"https://chat-elgin-default-rtdb.firebaseio.com",projectId:"chat-elgin",storageBucket:"chat-elgin.firebasestorage.app",messagingSenderId:"751356348223",appId:"1:751356348223:web:afa81eb49c715df3de358a"};
let firebaseLoaded=false;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initFirebase(){
 try{
  await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js");
  await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js");
  await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js");
  await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js");
  firebase.initializeApp(firebaseConfig);
  firebaseLoaded=true;
  document.getElementById('status').textContent='Firebase pronto';
  document.getElementById('status').style.color='#22c55e';
  setupAuth();
 }catch(e){ document.getElementById('status').textContent='Erro: '+e.message; }
}
let currentUser=null, currentChannel='geral', currentChannelType='channel', listeners={}, messagesCache={}, channelType='public', allChannelsCache={}, unreadCounts={}, globalNotifiers={}, initialLoadDone=false, notifPermission=false, notifSoundEnabled=true, originalTitle=document.title, readsCache={}, readsListener=null;
function showErr(id,msg){const el=document.getElementById(id);el.style.display='block';el.textContent=msg}
function hideErr(id){document.getElementById(id).style.display='none'}
function setupAuth(){
 firebase.auth().onAuthStateChanged(async (user)=>{
  if(user){
   const uid=user.uid;
   const snap=await firebase.database().ref('users/'+uid).once('value');
   let data=snap.val();
   if(!data){
     const pendingNome=localStorage.getItem('pendingNome')||user.email.split('@')[0];
     const pendingCargo=localStorage.getItem('pendingCargo')||'Colaborador';
     const pendingColor=localStorage.getItem('pendingColor')||selColor;
     data={id:uid,nome:pendingNome,cargo:pendingCargo,email:user.email,avatarColor:pendingColor,online:true,createdAt:Date.now()};
     await firebase.database().ref('users/'+uid).set(data);
   }else{
     await firebase.database().ref('users/'+uid).update({online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});
   }
   currentUser={id:uid,...data,nome:data.nome||data.email.split('@')[0]};
   document.getElementById('loginScreen').style.display='none';
   document.getElementById('chatScreen').style.display='flex';
   initChat();
  }else{
   document.getElementById('loginScreen').style.display='flex';
   document.getElementById('chatScreen').style.display='none';
  }
 });
 document.getElementById('btnReg').onclick=async()=>{
  hideErr('r_err');
  const nome=document.getElementById('r_nome').value.trim();
  const cargo=document.getElementById('r_cargo').value.trim()||'Colaborador';
  const email=document.getElementById('r_email').value.trim();
  const s=document.getElementById('r_senha').value;
  const s2=document.getElementById('r_senha2').value;
  if(nome.length<3) return showErr('r_err','Nome minimo 3 letras');
  if(!email.includes('@')) return showErr('r_err','Email invalido');
  if(s.length<6) return showErr('r_err','Senha minima 6');
  if(s!==s2) return showErr('r_err','Senhas nao conferem');
  if(!firebaseLoaded) return showErr('r_err','Firebase carregando...');
  localStorage.setItem('pendingNome',nome);localStorage.setItem('pendingCargo',cargo);localStorage.setItem('pendingColor',selColor);
  document.getElementById('btnReg').textContent='Criando...';document.getElementById('btnReg').disabled=true;
  try{ await firebase.auth().createUserWithEmailAndPassword(email,s); }catch(e){ let msg=e.message; if(e.code==='auth/email-already-in-use') msg='Email ja cadastrado'; showErr('r_err',msg); }
  document.getElementById('btnReg').textContent='Criar conta e entrar';document.getElementById('btnReg').disabled=false;
 };
 document.getElementById('btnLogin').onclick=async()=>{
  hideErr('l_err');
  const email=document.getElementById('l_email').value.trim();
  const s=document.getElementById('l_senha').value;
  if(!email||!s) return showErr('l_err','Preencha email e senha');
  if(!firebaseLoaded) return showErr('l_err','Firebase carregando...');
  document.getElementById('btnLogin').textContent='Entrando...';document.getElementById('btnLogin').disabled=true;
  try{ await firebase.auth().signInWithEmailAndPassword(email,s); }catch(e){ showErr('l_err','Senha incorreta'); }
  document.getElementById('btnLogin').textContent='Entrar no Connect';document.getElementById('btnLogin').disabled=false;
 };
}
function initChat(){
 const defaultChans = {geral:{id:'geral',label:'# geral',protected:true, isPublic:true}};
 firebase.database().ref('channel_list').once('value').then(snap=>{ if(!snap.exists()) firebase.database().ref('channel_list').set(defaultChans); });
 firebase.database().ref('channel_list').on('value', snap=>{
   const val = snap.val() || defaultChans;
   allChannelsCache = val;
   renderChannelList(val);
 });
 firebase.database().ref('users').on('value',snap=>{
  const val=snap.val()||{}; const list=Object.values(val).filter(u=>u && u.id);
  window.allUsers=list;
  renderUsers();
  document.getElementById('conn').textContent=list.length+' usuarios - '+list.filter(u=>u.online).length+' online';
  if(document.getElementById('createChannelModal').style.display==='flex') renderMembersChecklist();
 });
 firebase.database().ref('.info/connected').on('value',s=>{
   const sub=document.getElementById('chatSub');
   if(!s.val()){ sub.textContent='Desconectado'; sub.style.color='#ef4444'; return; }
   if(currentChannelType==='dm'){ sub.textContent='💬 Privada'; sub.style.color='#6366f1'; }
   else {
     const ch = allChannelsCache[currentChannel];
     if(ch && ch.members){ sub.textContent='🔒 Privado - '+Object.keys(ch.members).length+' membros'; sub.style.color='#f59e0b'; }
     else sub.textContent='● Público';
   }
 });
 selectChannel('geral','# geral','channel');
 setupGlobalNotifications();
 document.getElementById('search').oninput=(e)=>renderUsers(e.target.value);
 document.getElementById('msgForm').onsubmit=(e)=>{e.preventDefault();sendMsg()};
 document.getElementById('attachBtn').onclick=()=>document.getElementById('fileInput').click();
 document.getElementById('fileInput').onchange=(e)=>{const f=e.target.files[0]; if(f) showFilePreview(f); e.target.value='';};
 window.addEventListener('focus', ()=>{ document.title=originalTitle; if(currentChannel){ clearUnread(currentChannel); markAsRead(); } });
}

function renderChannelList(channelsObj){
 const cl=document.getElementById('chanList'); cl.innerHTML='';
 let list = Object.values(channelsObj);
 list = list.filter(ch=>{
   if(ch.id==='geral') return true;
   if(!ch.members) return true;
   return ch.members[currentUser.id] || ch.createdBy===currentUser.id;
 });
 list = list.sort((a,b)=> (a.id==='geral'?-1:b.id==='geral'?1: a.label.localeCompare(b.label)));
 list.forEach(ch=>{
  const isActive = ch.id===currentChannel && currentChannelType==='channel';
  const unread = unreadCounts[ch.id]||0;
  const d=document.createElement('div');
  d.style.cssText='padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;';
  d.style.background=isActive?'#1f2937':''; d.style.color=isActive?'white':'#9ca3af';
  if(unread>0 && !isActive){ d.style.background='#1f2937'; d.style.border='1px solid #6366f133'; }
  const canDelete = ch.id!=='geral';
  const isPrivate = ch.members ? '🔒 ' : '';
  const badge = unread>0 ? `<span class="badge badge-channel">${unread>99?'99+':unread}</span>` : '';
  d.innerHTML=`<span style="flex:1;display:flex;align-items:center;gap:6px" onclick="selectChannel('${ch.id}','${ch.label}','channel')">${isPrivate}${ch.label} ${badge}</span><div style="display:flex;gap:4px"><button onclick="openManageMembers('${ch.id}')" style="width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:#6366f1;cursor:pointer;font-size:12px">👥</button>${canDelete?`<button onclick="deleteChannel('${ch.id}','${ch.label}')" style="width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:#ef4444;cursor:pointer;font-size:12px">🗑️</button>`:''}</div>`;
  cl.appendChild(d);
 });
 updateTotalUnread();
}

function renderUsers(filter=''){
 const cont=document.getElementById('userList'); if(!window.allUsers){cont.innerHTML='<div style=color:#6b7280>Carregando...</div>';return}
 let list=window.allUsers.filter(u=>u.id!==currentUser.id);
 if(filter){const f=filter.toLowerCase(); list=list.filter(u=> ((u.nome||'')+' '+(u.cargo||'')+' '+(u.email||'')).toLowerCase().includes(f))}
 if(list.length===0){cont.innerHTML='<div style=color:#6b7280;font-size:13px;padding:8px>Nenhum usuario.</div>';return}
 cont.innerHTML='';
 list.sort((a,b)=>(b.online?1:0)-(a.online?1:0)).forEach(u=>{
  const nome=u.nome|| (u.email?u.email.split('@')[0]:'Usuario');
  const dmId = [currentUser.id, u.id].sort().join('_');
  const unread = unreadCounts[dmId]||0;
  const d=document.createElement('div');d.style.cssText='display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;color:#d1d5db;position:relative';
  if(unread>0){ d.style.background='#1f2937'; d.style.border='1px solid #ef444433'; }
  d.onmouseenter=()=>{ if(unread===0) d.style.background='#1f2937'; }; d.onmouseleave=()=>{ if(unread===0) d.style.background='transparent'; };
  d.innerHTML=`<div style="width:32px;height:32px;border-radius:50%;background:${u.avatarColor||'#6366f1'};display:grid;place-items:center;color:white;font-weight:700;font-size:12px">${nome[0].toUpperCase()}</div><div style="flex:1"><div style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px">${nome} ${unread>0?`<span class="badge badge-dm">${unread>99?'99+':unread}</span>`:''}</div><div style="font-size:11px;color:#6b7280">${u.cargo||u.email} - ${u.online?'online':'offline'}</div></div><div style="width:8px;height:8px;border-radius:50%;background:${u.online?'#22c55e':'#4b5563'}"></div>`;
  d.onclick=()=>selectUser(u);
  cont.appendChild(d);
 });
 updateTotalUnread();
}

function updateTotalUnread(){
 const total=Object.values(unreadCounts).reduce((a,b)=>a+b,0);
 const el=document.getElementById('totalUnread');
 if(total>0){ el.textContent=total>99?'99+':total; el.style.display='inline-flex'; document.title='('+total+') '+originalTitle; }
 else { el.style.display='none'; document.title=originalTitle; }
}

function setChannelType(t){
 channelType=t;
 document.getElementById('typePublic').style.borderColor=t==='public'?'#6366f1':'#334155';
 document.getElementById('typePublic').style.background=t==='public'?'#6366f122':'#0f172a';
 document.getElementById('typePrivate').style.borderColor=t==='private'?'#6366f1':'#334155';
 document.getElementById('typePrivate').style.background=t==='private'?'#6366f122':'#0f172a';
 document.getElementById('membersSection').style.display=t==='private'?'block':'none';
 if(t==='private') renderMembersChecklist();
}
function renderMembersChecklist(){
 const cont=document.getElementById('membersChecklist');
 if(!cont || !window.allUsers) return;
 cont.innerHTML='';
 window.allUsers.filter(u=>u.id!==currentUser.id).forEach(u=>{
  const nome=u.nome||u.email.split('@')[0];
  const div=document.createElement('div'); div.style.cssText='display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px';
  div.innerHTML=`<input type="checkbox" value="${u.id}" id="chk_${u.id}" style="width:auto"><label for="chk_${u.id}" style="margin:0;color:#d1d5db;flex:1">${nome} - ${u.cargo||u.email}</label>`;
  cont.appendChild(div);
 });
}
function openCreateChannelModal(){
 document.getElementById('newChannelName').value='';
 document.getElementById('createChanErr').style.display='none';
 channelType='public'; setChannelType('public');
 document.getElementById('createChannelModal').style.display='flex';
}
function closeCreateChannelModal(){ document.getElementById('createChannelModal').style.display='none'; }
function createChannel(){
 const raw=document.getElementById('newChannelName').value.trim().toLowerCase();
 const errEl=document.getElementById('createChanErr');
 errEl.style.display='none';
 if(!raw || raw.length<2){ errEl.textContent='Nome muito curto'; errEl.style.display='block'; return; }
 let id = raw.replace(/[^a-z0-9_-]/g, '-').replace(/-+/g,'-').replace(/^[-_]+|[-_]+$/g,'');
 if(!id || id==='geral'){ errEl.textContent='Nome reservado'; errEl.style.display='block'; return; }
 firebase.database().ref('channel_list/'+id).once('value').then(snap=>{
   if(snap.exists()){ errEl.textContent='Canal já existe'; errEl.style.display='block'; return; }
   const label = '# '+id;
   let data = {id:id, label:label, createdBy: currentUser.id, createdAt: Date.now(), isPublic: channelType==='public'};
   if(channelType==='private'){
     const checks = document.querySelectorAll('#membersChecklist input:checked');
     let members = {}; members[currentUser.id]=true;
     checks.forEach(c=>{ members[c.value]=true; });
     data.members = members;
   }
   firebase.database().ref('channel_list/'+id).set(data).then(()=>{ closeCreateChannelModal(); selectChannel(id, label, 'channel'); });
 });
}
function deleteChannel(id, label){
 if(id==='geral'){ alert('Não pode excluir #geral'); return; }
 if(!confirm('Excluir canal '+label+'?')) return;
 firebase.database().ref('channel_list/'+id).remove();
 firebase.database().ref('channels/'+id).remove();
 firebase.database().ref('channels/'+id+'/reads').remove();
 if(currentChannel===id) selectChannel('geral','# geral','channel');
}
let editingChannelId=null;
function openManageMembers(chanId=null){
 editingChannelId = chanId || currentChannel;
 if(!editingChannelId || currentChannelType==='dm'){ alert('Selecione um canal'); return; }
 const ch = allChannelsCache[editingChannelId];
 if(!ch){ alert('Canal não encontrado'); return; }
 document.getElementById('manageTitle').textContent='Membros de '+ch.label;
 document.getElementById('manageMembersModal').style.display='flex';
 const cont=document.getElementById('manageChecklist');
 cont.innerHTML='';
 const members = ch.members || null;
 const list = [{id:currentUser.id, nome:currentUser.nome+' (você)'}, ... (window.allUsers||[]).filter(u=>u.id!==currentUser.id)];
 list.forEach(u=>{
   const nome=u.nome||u.email;
   const isMember = !members || members[u.id] || u.id===currentUser.id;
   const div=document.createElement('div'); div.style.cssText='display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px';
   div.innerHTML=`<input type="checkbox" value="${u.id}" id="mchk_${u.id}" ${isMember?'checked':''} style="width:auto" ${u.id===currentUser.id?'disabled':''}><label for="mchk_${u.id}" style="margin:0;color:#d1d5db;flex:1">${nome}</label>`;
   cont.appendChild(div);
 });
}
function closeManageMembers(){ document.getElementById('manageMembersModal').style.display='none'; editingChannelId=null; }
function saveMembers(){
 if(!editingChannelId) return;
 const checks = document.querySelectorAll('#manageChecklist input:checked');
 let members = {}; checks.forEach(c=>{ members[c.value]=true; }); members[currentUser.id]=true;
 if(Object.keys(members).length<=1){
   if(confirm('Deixar canal público?')){ firebase.database().ref('channel_list/'+editingChannelId+'/members').remove(); closeManageMembers(); return; }
 }
 firebase.database().ref('channel_list/'+editingChannelId+'/members').set(members);
 closeManageMembers();
}

function selectChannel(id,label,type='channel'){
 if(listeners.msg){ listeners.msg.off('child_added'); listeners.msg.off('child_removed'); }
 if(readsListener){ readsListener.off(); readsListener=null; }
 currentChannel=id; currentChannelType=type; messagesCache={}; readsCache={};
 document.getElementById('chatTitle').textContent=label;
 const ch = allChannelsCache[id];
 const sub=document.getElementById('chatSub');
 if(type==='dm'){ sub.textContent='💬 Privada'; sub.style.color='#6366f1'; document.getElementById('manageMembersBtn').style.display='none'; }
 else { if(ch && ch.members){ sub.textContent='🔒 Privado - '+Object.keys(ch.members).length+' membros'; sub.style.color='#f59e0b'; } else sub.textContent='● Público'; document.getElementById('manageMembersBtn').style.display='block'; }
 document.getElementById('msgs').innerHTML='';
 clearUnread(id);
 let basePath = type==='dm' ? 'dms/'+id : 'channels/'+id;
 if(type==='channel' && ch && ch.members && !ch.members[currentUser.id] && ch.createdBy!==currentUser.id){
   document.getElementById('msgs').innerHTML='<div style="text-align:center;padding:40px;color:#64748b">🔒 Sem acesso</div>'; return;
 }
 const ref=firebase.database().ref(basePath+'/messages').limitToLast(150);
 listeners.msg=ref;
 ref.on('child_added',snap=>{ const m=snap.val(); if(!m) return; messagesCache[snap.key]=m; addMsg(m, snap.key); if(m.userId!==currentUser.id){ setTimeout(()=>markAsRead(),500); } });
 ref.on('child_removed',snap=>{ const el=document.getElementById('msg-'+snap.key); if(el) el.remove(); delete messagesCache[snap.key]; });
 // listener para visualizações
 const readsRef=firebase.database().ref(basePath+'/reads');
 readsListener=readsRef;
 readsRef.on('value', snap=>{
   readsCache=snap.val()||{};
   // atualiza status de todas as mensagens já renderizadas
   Object.keys(messagesCache).forEach(k=>{
     updateReadStatus(k, messagesCache[k]);
   });
 });
 // marca como lido ao entrar
 setTimeout(()=>markAsRead(),1000);
}

function markAsRead(){
 if(!currentUser) return;
 let basePath = currentChannelType==='dm' ? 'dms/'+currentChannel : 'channels/'+currentChannel;
 const lastKey = Object.keys(messagesCache).length ? Object.keys(messagesCache)[Object.keys(messagesCache).length-1] : null;
 const lastMsg = lastKey ? messagesCache[lastKey] : null;
 const data = {userId: currentUser.id, nome: currentUser.nome, timestamp: Date.now(), lastMessageId: lastKey||'', lastMessageTime: lastMsg ? lastMsg.timestamp : Date.now()};
 firebase.database().ref(basePath+'/reads/'+currentUser.id).set(data);
}

function getReadStatus(msgKey, msg){
 if(!msg || msg.userId!==currentUser.id) return null;
 // não mostra status para mensagens próprias se ninguém leu além de você
 const reads = Object.values(readsCache).filter(r=>r.userId!==currentUser.id);
 if(reads.length===0) return {icon:'✓', text:'Enviado', cls:'read-sent'};
 // verifica se alguém leu esta mensagem específica
 let seenBy=[];
 reads.forEach(r=>{
   if(r.lastMessageTime && r.lastMessageTime >= msg.timestamp) seenBy.push(r);
   else if(r.lastMessageId && messagesCache[r.lastMessageId] && messagesCache[r.lastMessageId].timestamp >= msg.timestamp) seenBy.push(r);
 });
 if(seenBy.length===0){
   return {icon:'✓✓', text:'Entregue', cls:'read-delivered'};
 }
 if(currentChannelType==='dm'){
   const seen = seenBy[0];
   return {icon:'✓✓', text:'Visualizado por '+seen.nome, cls:'read-seen-blue'};
 } else {
   if(seenBy.length===1) return {icon:'✓✓', text:'Visto por '+seenBy[0].nome, cls:'read-seen'};
   return {icon:'✓✓', text:'Visto por '+seenBy.length+' pessoas', cls:'read-seen'};
 }
}

function updateReadStatus(msgKey, msg){
 const el=document.getElementById('read-'+msgKey);
 if(!el) return;
 const status=getReadStatus(msgKey, msg);
 if(!status){ el.innerHTML=''; return; }
 el.innerHTML=`<span class="${status.cls}">${status.icon} ${status.text}</span>`;
}

function selectUser(u){
 const ids=[currentUser.id,u.id].sort(); const dmId=ids.join('_');
 selectChannel(dmId,'💬 '+ (u.nome||u.email), 'dm');
 document.getElementById('chatTitle').textContent='💬 '+ (u.nome||u.email);
}

function addMsg(m, key){
 if(!m) return;
 const msgKey = key || m.id;
 if(document.getElementById('msg-'+msgKey)) return;
 const box=document.getElementById('msgs');
 const wrap=document.createElement('div'); wrap.id='msg-'+msgKey; wrap.className='msg-wrap';
 const isMe=m.userId===currentUser.id;
 const nome=m.user||m.nome||'Usuario';
 let content = '';
 if(m.text) content+=`<div style="margin-top:4px;background:${isMe?'#eef2ff':'white'};border:1px solid #e2e8f0;padding:10px 12px;border-radius:12px;font-size:14px;color:#1e293b;max-width:520px;word-break:break-word">${escapeHtml(m.text)}</div>`;
 if(m.fileUrl){
   const isImage = m.fileType && m.fileType.startsWith('image/');
   if(isImage) content+=`<a href="${m.fileUrl}" target="_blank"><img src="${m.fileUrl}" style="max-width:200px;max-height:200px;border-radius:10px;margin-top:8px;border:1px solid #e2e8f0" loading="lazy"></a><div style="font-size:12px;color:#64748b;margin-top:4px">${m.fileName} • <a href="${m.fileUrl}" target="_blank" download style="color:#6366f1">Baixar</a></div>`;
   else content+=`<div style="display:flex;align-items:center;gap:10px;background:#f1f5f9;padding:10px;border-radius:10px;margin-top:8px;border:1px solid #e2e8f0"><div style="font-size:24px">📄</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#111827">${m.fileName||'arquivo'}</div></div><a href="${m.fileUrl}" target="_blank" download style="padding:6px 12px;background:#6366f1;color:white;border-radius:8px;text-decoration:none;font-size:12px">Baixar</a></div>`;
 }
 const delBtn = isMe ? `<div class="msg-actions"><button class="del-btn" onclick="deleteMsg('${msgKey}')" title="Excluir">🗑️</button></div>` : '';
 const status = getReadStatus(msgKey, m);
 const statusHtml = status && isMe ? `<div id="read-${msgKey}" class="read-status"><span class="${status.cls}">${status.icon} ${status.text}</span></div>` : (isMe ? `<div id="read-${msgKey}" class="read-status"><span class="read-sent">✓ Enviado</span></div>` : '');
 wrap.innerHTML=`<div style="width:36px;height:36px;border-radius:50%;background:${m.avatarColor||'#6366f1'};display:grid;place-items:center;color:white;font-weight:700;flex-shrink:0">${nome[0].toUpperCase()}</div><div><div style="display:flex;gap:8px;align-items:center"><b style="font-size:14px;color:#111827">${escapeHtml(nome)}</b><span style="font-size:11px;color:#64748b">${m.timestamp?new Date(m.timestamp).toLocaleTimeString():''}</span>${delBtn}</div>${content}${statusHtml}</div>`;
 box.appendChild(wrap); box.scrollTop=box.scrollHeight;
}

let pendingFile=null;
function showFilePreview(file){
 if(file.size>15*1024*1024){ alert('Arquivo muito grande'); return; }
 pendingFile=file;
 const modal=document.getElementById('filePreviewModal');
 const img=document.getElementById('previewImg');
 const icon=document.getElementById('previewFileIcon');
 const nameEl=document.getElementById('previewFileName');
 const sizeEl=document.getElementById('previewFileSize');
 document.getElementById('previewCaption').value='';
 if(file.type.startsWith('image/')){
   const reader=new FileReader();
   reader.onload=(e)=>{ img.src=e.target.result; img.style.display='block'; icon.style.display='none'; };
   reader.readAsDataURL(file);
 } else {
   img.style.display='none'; icon.style.display='block';
   nameEl.textContent=file.name; sizeEl.textContent=(file.size/1024).toFixed(1)+' KB';
 }
 modal.style.display='flex';
}
function cancelFilePreview(){ pendingFile=null; document.getElementById('filePreviewModal').style.display='none'; }
function confirmFileSend(){
 if(!pendingFile) return;
 const caption=document.getElementById('previewCaption').value.trim();
 document.getElementById('filePreviewModal').style.display='none';
 uploadFile(pendingFile, caption);
 pendingFile=null;
}
function escapeHtml(t){return (t||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sendMsg(){
 const input=document.getElementById('msgInput');const text=input.value.trim(); if(!text) return;
 let path = currentChannelType==='dm' ? 'dms/'+currentChannel+'/messages' : 'channels/'+currentChannel+'/messages';
 const ref=firebase.database().ref(path).push();
 ref.set({id:ref.key,text,user:currentUser.nome,userId:currentUser.id,cargo:currentUser.cargo,avatarColor:currentUser.avatarColor,timestamp:Date.now()});
 input.value='';input.focus();
}
async function uploadFile(file, captionText=""){
 if(file.size>15*1024*1024) return alert('Muito grande');
 const info=document.getElementById('uploadInfo'); const txt=document.getElementById('uploadText'); const bar=document.getElementById('progressBar');
 info.style.display='block'; txt.textContent='Enviando '+file.name+'...'; bar.style.width='15%';
 if(file.size < 3*1024*1024){
   const reader=new FileReader();
   reader.onload=async (e)=>{
     try{
       bar.style.width='70%';
       let path = currentChannelType==='dm' ? 'dms/'+currentChannel+'/messages' : 'channels/'+currentChannel+'/messages';
       const ref=firebase.database().ref(path).push();
       await ref.set({id:ref.key,text:captionText||'',fileUrl:e.target.result,fileName:file.name,fileType:file.type,fileSize:file.size,user:currentUser.nome,userId:currentUser.id,avatarColor:currentUser.avatarColor,timestamp:Date.now(),isBase64:true});
       bar.style.width='100%'; setTimeout(()=>info.style.display='none',800);
     }catch(err){ info.style.display='none'; alert('Erro: '+err.message); }
   };
   reader.readAsDataURL(file); return;
 }
 try{
  const storageRef=firebase.storage().ref('chat_files/'+currentChannel+'/'+Date.now()+'_'+file.name);
  const task=storageRef.put(file);
  task.on('state_changed', snap=>{ const pct=(snap.bytesTransferred/snap.totalBytes*100).toFixed(0); bar.style.width=pct+'%'; txt.textContent='Enviando '+pct+'%'; }, err=>{ info.style.display='none'; alert('Erro: '+err.message); }, async ()=>{
   const url=await task.snapshot.ref.getDownloadURL();
   let path = currentChannelType==='dm' ? 'dms/'+currentChannel+'/messages' : 'channels/'+currentChannel+'/messages';
   const ref=firebase.database().ref(path).push();
   await ref.set({id:ref.key,text:captionText||'',fileUrl:url,fileName:file.name,fileType:file.type,fileSize:file.size,user:currentUser.nome,userId:currentUser.id,avatarColor:currentUser.avatarColor,timestamp:Date.now()});
   setTimeout(()=>info.style.display='none',600);
  });
 }catch(e){ info.style.display='none'; alert('Erro: '+e.message); }
}
function deleteMsg(msgKey){
 if(!confirm('Excluir esta mensagem?')) return;
 const m=messagesCache[msgKey];
 if(m && m.userId !== currentUser.id){ alert('Só pode excluir suas'); return; }
 let path = currentChannelType==='dm' ? 'dms/'+currentChannel+'/messages/'+msgKey : 'channels/'+currentChannel+'/messages/'+msgKey;
 firebase.database().ref(path).remove().then(()=>{ const el=document.getElementById('msg-'+msgKey); if(el) el.remove(); });
}
function toggleNotifications(){
 if(Notification && Notification.permission!=='granted'){
   Notification.requestPermission().then(p=>{ notifPermission=p==='granted'; notifSoundEnabled=true; updateNotifBtn(); });
 } else {
   notifSoundEnabled=!notifSoundEnabled; updateNotifBtn(); if(notifSoundEnabled) playNotifSound();
 }
}
function updateNotifBtn(){
 const btn=document.getElementById('notifBtn'); if(!btn) return;
 btn.textContent=notifSoundEnabled?'🔔':'🔕';
}
function playNotifSound(){
 try{
   const ctx=new (window.AudioContext||window.webkitAudioContext)();
   const o=ctx.createOscillator(); const g=ctx.createGain();
   o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
   g.gain.setValueAtTime(0.3, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.3);
   o.start(); o.stop(ctx.currentTime+0.3);
 }catch(e){}
}
function showBrowserNotification(title, body, channelId){
 if(!notifPermission || Notification.permission!=='granted') return;
 if(!document.hidden && currentChannel===channelId) return;
 try{
   const n=new Notification(title, {body: body});
   n.onclick=()=>{ window.focus(); if(channelId){ const ch=allChannelsCache[channelId]; if(ch) selectChannel(channelId, ch.label, 'channel'); else selectChannel(channelId, '#'+channelId, 'channel'); } n.close(); };
   setTimeout(()=>n.close(),6000);
 }catch(e){}
}
function setupGlobalNotifications(){
 if(Notification && Notification.permission==='default'){ Notification.requestPermission().then(p=>{ notifPermission=p==='granted'; }); }
 else if(Notification && Notification.permission==='granted') notifPermission=true;
 notifSoundEnabled=true; updateNotifBtn();
 firebase.database().ref('channel_list').on('value', snap=>{
   const chans=snap.val()||{};
   Object.keys(chans).forEach(cid=>{
     const ch=chans[cid];
     if(ch.members && !ch.members[currentUser.id] && ch.createdBy!==currentUser.id) return;
     if(globalNotifiers[cid]) return;
     const ref=firebase.database().ref('channels/'+cid+'/messages').limitToLast(1);
     globalNotifiers[cid]=ref;
     ref.on('child_added', s=>{
       const m=s.val(); if(!m) return;
       if(m.userId===currentUser.id) return;
       if(!initialLoadDone) return;
       if(Date.now() - m.timestamp > 10000) return;
       if(cid===currentChannel && !document.hidden) return;
       unreadCounts[cid]=(unreadCounts[cid]||0)+1;
       renderChannelList(allChannelsCache);
       const preview = m.text ? m.text.substring(0,60) : (m.fileName ? '📎 '+m.fileName : 'Nova mensagem');
       showBrowserNotification((ch.label||'#'+cid)+' - '+m.user, preview, cid);
       playNotifSound();
     });
   });
 });
 firebase.database().ref('dms').on('child_added', snap=>{
   const dmId=snap.key;
   if(!dmId.includes(currentUser.id)) return;
   if(globalNotifiers['dm_'+dmId]) return;
   const ref=firebase.database().ref('dms/'+dmId+'/messages').limitToLast(1);
   globalNotifiers['dm_'+dmId]=ref;
   ref.on('child_added', s=>{
     const m=s.val(); if(!m) return;
     if(m.userId===currentUser.id) return;
     if(!initialLoadDone) return;
     if(Date.now() - m.timestamp > 10000) return;
     if(dmId===currentChannel && !document.hidden) return;
     unreadCounts[dmId]=(unreadCounts[dmId]||0)+1;
     renderUsers(); renderChannelList(allChannelsCache);
     const preview = m.text ? m.text.substring(0,60) : '📎 Arquivo';
     showBrowserNotification('💬 '+m.user, preview, dmId);
     playNotifSound();
   });
 });
 setTimeout(()=>{ initialLoadDone=true; }, 4000);
}
function clearUnread(channelId){
 if(unreadCounts[channelId]){ delete unreadCounts[channelId]; renderChannelList(allChannelsCache); renderUsers(); updateTotalUnread(); }
}
async function doLogout(){
 if(currentUser) await firebase.database().ref('users/'+currentUser.id).update({online:false});
 await firebase.auth().signOut();
 location.reload();
}
setTimeout(initFirebase,400);
</script>
